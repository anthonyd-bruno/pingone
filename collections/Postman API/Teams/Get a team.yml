info:
  name: Get a team
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/teams/:teamId"
  headers:
    - name: identifierType
      value: scim
      description: Use SCIM user and group IDs instead of Postman user IDs.
      disabled: true
  params:
    - name: include
      value: ""
      type: query
      description: |-
        Include additional information in the request's response:
        - `members` — Include all users and groups, including groups that represent other teams or the entire organization, with access to the team's entities. This includes team managers, members, and persons invited to collaborate as guests.
        - `userRoles` — Include all the team's user roles in the response.
      disabled: true
    - name: teamId
      value: ""
      type: path
      description: The team's ID.
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/teams/:teamId
      method: GET
      params:
        - name: teamId
          value: "123"
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "team": {
                  "createdAt": "2025-02-26T08:17:42.000Z",
                  "updatedAt": "2025-02-26T08:17:42.000Z",
                  "id": 123,
                  "name": "Testing Team",
                  "handle": "testing-team",
                  "description": "API testing team.",
                  "organizationId": 1,
                  "createdBy": 12345678,
                  "enabled": true
              }
          }
  - name: Successful Response with SCIM IDs
