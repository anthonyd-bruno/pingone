info:
  name: Remove team members
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/teams/:teamId/bulk-members"
  headers:
    - name: identifierType
      value: scim
      description: Use SCIM user and group IDs instead of Postman user IDs.
      disabled: true
  params:
    - name: teamId
      value: ""
      type: path
      description: The team's ID.
  body:
    type: json
    data: |-
      {
          "entities": [
              {
                  "entityType": "{{entityType}}",
                  "entityId": "{{entityId}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Remove Team Members
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: DELETE
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {
              "entities": [
                  {
                      "entityType": "user",
                      "entityId": "87654321"
                  },
                  {
                      "entityType": "user",
                      "entityId": "56781234"
                  }
              ]
          }
    response:
      statusText: "204"
      body:
        type: text
        data: ""
