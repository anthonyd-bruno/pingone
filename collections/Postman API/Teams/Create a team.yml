info:
  name: Create a team
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/teams"
  headers:
    - name: identifierType
      value: scim
      description: Use SCIM user and group IDs instead of Postman user IDs.
      disabled: true
  body:
    type: json
    data: |-
      {
          "name": "{{name}}",
          "description": "{{description}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Team Created
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing Team",
              "description": "API testing team."
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "team": {
                  "createdAt": "2025-02-26T08:17:42.000Z",
                  "updatedAt": "2025-02-26T08:17:42.000Z",
                  "id": 123,
                  "name": "Testing Team",
                  "handle": "testing-team",
                  "description": "API testing team.",
                  "organizationId": 1,
                  "createdBy": 12345678,
                  "enabled": true
              }
          }
  - name: Team Created with SCIM IDs
    request:
      url: https://api.getpostman.com/teams
      method: POST
      headers:
        - name: identifierType
          value: scim
      body:
        type: json
        data: |-
          {
              "name": "Testing Team",
              "description": "API testing team."
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "team": {
                  "createdAt": "2025-02-26T08:17:42.000Z",
                  "updatedAt": "2025-02-26T08:17:42.000Z",
                  "id": 123,
                  "name": "Testing Team",
                  "handle": "testing-team",
                  "description": "API testing team.",
                  "organizationId": 1,
                  "createdBy": "33d8e85cc5ec04715bb0c18b42312d80413bad8a96622eb7",
                  "enabled": true
              }
          }
  - name: Team Name Already Exists
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing Team",
              "description": "API testing team."
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400,
              "title": "Bad Request",
              "detail": {
                  "error": {
                      "name": "InvalidParams",
                      "message": "This name is already taken in the organization. Please choose another."
                  }
              },
              "instance": "/teams"
          }
  - name: Invalid Team Name
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing@Team",
              "description": "API testing team."
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400,
              "title": "Bad Request",
              "detail": {
                  "error": {
                      "name": "InvalidParams",
                      "message": "Only alphanumeric characters and spaces are allowed in the name"
                  }
              },
              "instance": "/teams"
          }
  - name: Team Feature Unavailable
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing@Team",
              "description": "API testing team."
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400,
              "title": "Bad Request",
              "detail": {
                  "error": {
                      "name": "BadRequest",
                      "message": "Team feature is not available for your organization."
                  }
              },
              "instance": "/teams"
          }
  - name: API Key Missing
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing@Team",
              "description": "API testing team."
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "title": "Unauthorized",
              "instance": "/teams",
              "status": 401,
              "type": "https://api.postman.com/problems/unauthorized",
              "detail": "Unauthorized"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/teams
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Testing Team",
              "description": "API testing team."
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "status": 403,
              "title": "Forbidden",
              "detail": {
                  "error": {
                      "name": "NoPermission",
                      "message": "You are not allowed to create Team."
                  }
              },
              "instance": "/teams"
          }

docs: "[Creates](https://learning.postman.com/docs/administration/managing-your-team/create-teams/) a Postman team in your organization."
