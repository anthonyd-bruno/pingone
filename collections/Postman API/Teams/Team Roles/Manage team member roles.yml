          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "result": [
                  {
                      "entityType": "user",
                      "entityId": 12345678,
                      "role": "TEAM_DEVELOPER",
                      "status": "Skipped",
                      "reason": "Entity has this role"
                  }
              ]
          }
  - name: Add and Remove Roles with SCIM IDs
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      headers:
        - name: identifierType
          value: scim
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {
              "add": {
                  "users": {
                      "f10ba7a8dac248e8fd9769163dc63aef920f3897c7ea2c86": [
                          "TEAM_MANAGER"
                      ]
                  }
              },
              "remove": {
                  "groups": {
                      "gecb77b6c45c98602d6ae4458b46d4f30e3c423719636d87": [
                          "TEAM_DEVELOPER"
                      ]
                  },
                  "users": {
                      "7db6e2fba7e98f9db428a1735a71bbb4e4fbbaa37db37640": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              }
          }
    response:
      statusText: "200"
      body:
        type: text
