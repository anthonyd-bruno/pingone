                  {
                      "entityType": "group",
                      "entityId": "gecb77b6c45c98602d6ae4458b46d4f30e3c423719636d87",
                      "role": null,
                      "previousRole": "TEAM_DEVELOPER",
                      "status": "Accepted"
                  },
                  {
                      "entityType": "user",
                      "entityId": "7db6e2fba7e98f9db428a1735a71bbb4e4fbbaa37db37640",
                      "role": null,
                      "previousRole": "TEAM_DEVELOPER",
