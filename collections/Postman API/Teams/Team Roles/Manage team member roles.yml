                      "entityType": "organization",
                      "entityId": 345,
                      "role": "TEAM_GUEST_DEVELOPER",
                      "previousRole": "TEAM_GUEST_VIEWER",
                      "status": "Accepted"
                  }
              ]
          }
  - name: Update Team Role
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
