                          "TEAM_DEVELOPER"
                      ]
                  }
              },
              "remove": {
                  "users": {
                      "456": [
                          "TEAM_DEVELOPER"
                      ]
                  },
                  "groups": {
                      "998": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              }
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400,
              "title": "Bad Request",
              "detail": {
                  "error": {
                      "name": "BadRequest",
                      "message": "Team feature is not available for your organization."
                  }
              },
              "instance": "/teams"
          }
  - name: API Key Missing
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
          type: path
          description: The team's ID.
      body:
        type: json
        data: |-
          {
              "add": {
                  "users": {
                      "123": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              },
              "remove": {
                  "users": {
                      "456": [
                          "TEAM_DEVELOPER"
                      ]
                  },
                  "groups": {
                      "998": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              }
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "title": "Unauthorized",
              "instance": "/teams",
              "status": 401,
              "type": "https://api.postman.com/problems/unauthorized",
              "detail": "Unauthorized"
          }

docs: |-
  Adds or removes roles in groups, teams, organizations, as well as individual users' roles.

  **Note:**

  If you remove a role from a group or team, then all members lose the that role's permissions.
