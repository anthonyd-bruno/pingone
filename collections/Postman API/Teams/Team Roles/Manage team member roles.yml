              "add": {
                  "users": {
                      "12345678": [
                          "TEAM_MANAGER"
                      ]
                  }
              },
              "remove": {
                  "users": {
                      "87654321": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "result": [
                  {
                      "entityType": "user",
                      "entityId": 12345678,
                      "role": "TEAM_MANAGER",
                      "previousRole": null,
                      "status": "Accepted"
                  },
                  {
                      "entityType": "user",
                      "entityId": 87654321,
                      "role": null,
                      "previousRole": "TEAM_DEVELOPER",
                      "status": "Accepted"
                  }
              ]
          }
  - name: Add and Remove Roles with Failures
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {
              "add": {
                  "users": {
                      "12345678": [
                          "TEAM_MANAGER"
                      ]
                  }
              },
              "remove": {
                  "users": {
                      "87654321": [
                          "TEAM_MANAGER"
                      ]
                  }
              }
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400,
              "title": "Bad Request",
              "detail": {
                  "error": "Found invalid entities",
                  "result": [
                      {
                          "entityType": "user",
                          "entityId": 87654321,
                          "role": null,
                          "status": "Invalid",
                          "reason": "Existing and new roles are empty"
                      }
                  ]
              },
              "instance": "/teams/123/members"
          }
  - name: Team Member Has Role
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
