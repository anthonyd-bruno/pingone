  - name: Entity Does Not Belong to Organization
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      headers:
        - name: identifierType
          value: scim
          description: Use SCIM user and group IDs instead of Postman user IDs.
          disabled: true
      params:
        - name: teamId
          value: "123"
          type: path
          description: The team's ID.
      body:
        type: json
        data: |-
          {
              "add": {
                  "users": {
                      "12345678": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              },
              "remove": {
                  "users": {
                      "56781234": [
                          "TEAM_DEVELOPER"
