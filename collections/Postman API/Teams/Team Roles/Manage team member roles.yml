info:
  name: Manage team member roles
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/teams/:teamId/bulk-members"
  headers:
    - name: identifierType
      value: scim
      description: Use SCIM user and group IDs instead of Postman user IDs.
      disabled: true
  params:
    - name: teamId
      value: ""
      type: path
      description: The team's ID.
  body:
    type: json
    data: |-
      {
          "add": {
              "users": {
                  "{{userId}}": [
                      "{{roleName}}"
                  ]
              },
              "groups": {
                  "{{userGroupId}}": [
                      "{{roleName}}"
                  ]
              },
              "orgs": {
                  "{{orgId}}": [
                      "{{roleName}}"
                  ]
              },
              "teams": {
                  "{{teamId}}": [
                      "{{roleName}}"
                  ]
              }
          },
          "remove": {
              "users": {
                  "{{userId}}": [
                      "{{roleName}}"
                  ]
              },
              "groups": {
                  "{{userGroupId}}": [
                      "{{roleName}}"
                  ]
              },
              "orgs": {
                  "{{orgId}}": [
                      "{{roleName}}"
                  ]
              },
              "teams": {
                  "{{teamId}}": [
                      "{{roleName}}"
                  ]
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Assign Team Member's Role
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {
              "add": {
                  "users": {
                      "12345678": [
                          "TEAM_MANAGER"
                      ]
                  },
                  "groups": {
                      "1234": [
                          "TEAM_DEVELOPER"
                      ]
                  }
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "result": [
                  {
                      "entityType": "user",
                      "entityId": 12345678,
                      "role": "TEAM_MANAGER",
                      "previousRole": null,
                      "status": "Accepted"
                  },
                  {
                      "entityType": "group",
                      "entityId": 1234,
                      "role": "TEAM_DEVELOPER",
                      "previousRole": null,
                      "status": "Accepted"
                  }
              ]
          }
  - name: Update Team Member's Role
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {  
              "add": {
                  "users": { 
                      "12345678": [
                          "TEAM_MANAGER"
                      ]
                  }
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "result": [
                  {
                      "entityType": "user",
                      "entityId": 12345678,
