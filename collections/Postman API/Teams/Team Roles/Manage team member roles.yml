  - name: Update Team Member's Role with SCIM ID
    request:
      url: https://api.getpostman.com/teams/:teamId/bulk-members
      method: POST
      headers:
        - name: identifierType
          value: scim
      params:
        - name: teamId
          value: "123"
          type: path
      body:
        type: json
        data: |-
          {  
              "add": {
                  "users": { 
                      "f10ba7a8dac248e8fd9769163dc63aef920f3897c7ea2c86": [
                          "TEAM_MANAGER"
                      ]
                  }
              }
