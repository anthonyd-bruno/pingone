info:
  name: Sync collection with spec
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/collections/:collectionUid/synchronizations?specId="
  params:
    - name: specId
      value: ""
      type: query
      description: (Required) The spec's ID.
    - name: collectionUid
      value: ""
      type: path
      description: The collection's unique ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionUid/synchronizations?specId=73e15000-bc7a-4802-b80e-05fff18fd7f8
      method: PUT
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: query
        - name: collectionUid
          value: 12345678-61867bcc-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "202"
      body:
        type: text
        data: |-
          {
              "taskId": "66ae9950-0869-4e65-96b0-1e0e47e771af",
              "url": "/specs/73e15000-bc7a-4802-b80e-05fff18fd7f8/tasks/66ae9950-0869-4e65-96b0-1e0e47e771af"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/collections/:collectionUid/synchronizations?specId=73e15000-bc7a-4802-b80e-05fff18fd7f8
      method: PUT
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: query
        - name: collectionUid
          value: 12345678-61867bcc-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/:collectionUid/synchronizations?specId=73e15000-bc7a-4802-b80e-05fff18fd7f8
      method: PUT
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: query
        - name: collectionUid
          value: 12345678-61867bcc-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "Resource not found",
              "status": 404,
              "detail": "Entity that you are trying to access does not exist."
          }

docs: |-
  Syncs a collection generated from an API specification. This is an asynchronous endpoint that returns an HTTP `202 Accepted` response.

  **Note:**

  - This endpoint only supports the OpenAPI 3.0 specification type.
      
  - You can only sync collections generated from the given spec ID.
