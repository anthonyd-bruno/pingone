info:
  name: Get all specs
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/specs?workspaceId="
  params:
    - name: workspaceId
      value: ""
      type: query
      description: The workspace's ID.
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
      disabled: true
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response. This value defaults to `10`.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

