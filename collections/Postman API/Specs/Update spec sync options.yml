info:
  name: Update spec sync options
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/specs/:specId/collections/:collectionId/sync-options"
  params:
    - name: specId
      value: ""
      type: path
      description: The spec's ID.
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  body:
    type: json
    data: |-
      {
          "syncOptions": {
              "syncExamples": true
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

