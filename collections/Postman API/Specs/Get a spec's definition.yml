info:
  name: Get a spec's definition
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/specs/:specId/definitions"
  params:
    - name: specId
      value: ""
      type: path
      description: The spec's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful JSON Response
    request:
      url: https://api.getpostman.com/specs/:specId/definition
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "openapi": "3.0.0",
              "servers": [
                  {
                      "url": "example.com"
                  }
              ],
              "info": {
                  "contact": {
                      "name": "Jon"
                  },
                  "version": "1.0.0",
                  "title": "Sample API",
                  "description": "Buy or rent spacecrafts"
              },
              "paths": {
                  "/spacecrafts/{spacecraftId}": {
                      "parameters": [
                          {
                              "name": "spacecraftId",
                              "description": "The unique identifier of the spacecraft",
                              "in": "path",
                              "required": true,
                              "schema": {
                                  "description": "The unique identifier of a spacecraft",
                                  "type": "string"
                              }
                          }
                      ],
                      "get": {
                          "summary": "Read a spacecraft",
                          "responses": {
                              "200": {
                                  "description": "The spacecraft corresponding to the provided `spacecraftId`",
                                  "content": {
                                      "application/json": {
                                          "schema": {
                                              "type": "object",
                                              "required": [
                                                  "id",
                                                  "name",
                                                  "type"
                                              ],
                                              "properties": {
                                                  "id": {
                                                      "description": "The unique identifier of a spacecraft",
                                                      "type": "string"
                                                  },
                                                  "name": {
                                                      "type": "string"
                                                  },
                                                  "type": {
                                                      "type": "string",
                                                      "enum": [
                                                          "capsule",
                                                          "probe",
                                                          "satellite",
                                                          "spaceplane",
                                                          "station"
                                                      ]
                                                  },
                                                  "description": {
                                                      "type": "string"
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              "404": {
                                  "description": "No spacecraft found for the provided `spacecraftId`",
                                  "content": {
                                      "application/json": {
                                          "schema": {
                                              "type": "object",
                                              "required": [
                                                  "message"
                                              ],
                                              "properties": {
                                                  "message": {
                                                      "description": "A human readable error message",
                                                      "type": "string"
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              "500": {
                                  "description": "Unexpected error",
                                  "content": {
                                      "application/json": {
                                          "schema": {
                                              "type": "object",
                                              "required": [
                                                  "message"
                                              ],
                                              "properties": {
                                                  "message": {
                                                      "description": "A human readable error message",
                                                      "type": "string"
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              },
              "components": {
                  "securitySchemes": {
                      "ApiKey": {
                          "type": "apiKey",
                          "in": "header",
                          "name": "X-Api-Key"
                      }
                  }
              },
              "security": [
                  {
                      "ApiKey": []
                  }
              ]
          }
  - name: Successful YAML Response
    request:
      url: https://api.getpostman.com/specs/:specId/definition
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/yaml
      body:
        type: text
        data: |-
          openapi: "3.0.0"
          servers:
              - url: example.com
          info:
              contact:
                  name: Jon
              version: "1.0.0"
              title: "Sample API"
              description: Buy or rent spacecrafts

          paths:
              /spacecrafts/{spacecraftId}:
                  parameters:
                      - name: spacecraftId
                        description: The unique identifier of the spacecraft
                        in: path
                        required: true
                        schema:
                          description: The unique identifier of a spacecraft
                          type: string
                  get:
                      summary: Read a spacecraft
                      responses:
                          "200":
                              description: The spacecraft corresponding to the provided `spacecraftId`
                              content:
                                  application/json:
                                      schema:
                                          type: object
                                          required:
                                              - id
                                              - name
                                              - type
                                          properties:
                                              id:
                                                  description: The unique identifier of a spacecraft
                                                  type: string
                                              name:
                                                  type: string
                                              type:
                                                  type: string
                                                  enum:
                                                      - capsule
                                                      - probe
                                                      - satellite
                                                      - spaceplane
                                                      - station
                                              description:
                                                  type: string
                          "404":
                              description: No spacecraft found for the provided `spacecraftId`
                              content:
                                  application/json:
                                      schema:
                                          type: object
                                          required:
                                              - message
                                          properties:
                                              message:
                                                  description: A human readable error message
                                                  type: string
                          "500":
                              description: Unexpected error
                              content:
                                  application/json:
                                      schema:
                                          type: object
                                          required:
                                              - message
                                          properties:
                                              message:
                                                  description: A human readable error message
                                                  type: string
          components:
              securitySchemes:
                  ApiKey:
                      type: apiKey
                      in: header
                      name: X-Api-Key
          security:
              - ApiKey: []
  - name: Malformed Specification
    request:
      url: https://api.getpostman.com/specs/:specId/definition
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "MalformedSpecification",
              "title": "Malformed Specification.",
              "status": 400,
              "detail": "The spec you are trying to fetch has errors, the definition for the same can't be generated"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/specs/:specId/definition
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/specs/:specId/definition
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "Resource not found",
              "status": 404,
              "detail": "Entity that you are trying to access does not exist."
          }

docs: Gets the complete contents of an API specification's definition.
