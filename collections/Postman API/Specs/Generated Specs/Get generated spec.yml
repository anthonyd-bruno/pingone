info:
  name: Get generated spec
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionUid/generations/:elementType"
  params:
    - name: collectionUid
      value: ""
      type: path
      description: The collection's unique ID.
    - name: elementType
      value: spec
      type: path
      description: The `spec` value.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionUid/generations/:elementType
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: elementType
          value: spec
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "meta": {
                  "nextCursor": null
              },
              "specs": [
                  {
                      "id": "e8a015e0-f472-4bb3-a523-57ce7c4583ef",
                      "name": "Sample API",
                      "state": "in-sync",
                      "createdAt": "2022-03-29T11:37:15Z",
                      "updatedAt": "2022-03-29T11:37:15Z",
                      "createdBy": 12345678,
                      "updatedBy": 12345678
                  }
              ]
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/collections/:collectionUid/generations/:elementType
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: elementType
          value: spec
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/:collectionUid/generations/:elementType
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: elementType
          value: spec
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "Resource not found",
              "status": 404,
              "detail": "Entity that you are trying to access does not exist."
          }

docs: Gets the API specification generated for the given collection.
