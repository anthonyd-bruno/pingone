info:
  name: Create a spec
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/specs?workspaceId="
  params:
    - name: workspaceId
      value: ""
      type: query
      description: The workspace's ID.
  body:
    type: json
    data: |-
      {
          "name": "{{specName}}",
          "type": "{{specType}}",
          "files": [
              {
                  "path": "{{filePath}}",
                  "content": "{{content}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

