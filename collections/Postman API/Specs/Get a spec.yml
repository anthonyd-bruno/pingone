info:
  name: Get a spec
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/specs/:specId"
  params:
    - name: specId
      value: ""
      type: path
      description: The spec's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/specs/:specId
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "id": "73e15000-bc7a-4802-b80e-05fff18fd7f8",
              "name": "Sample API",
              "type": "OPENAPI:3.0",
              "createdBy": 12345678,
              "updatedBy": 12345678,
              "createdAt": "2022-03-29T11:37:15Z",
              "updatedAt": "2022-03-29T11:37:15Z"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/specs/:specId
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/specs/:specId
      method: GET
      params:
        - name: specId
          value: 73e15000-bc7a-4802-b80e-05fff18fd7f8
          type: path
          description: The spec's ID.
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "Resource not found",
              "status": 404,
              "detail": "Entity that you are trying to access does not exist."
          }

docs: Gets information about an API specification.
