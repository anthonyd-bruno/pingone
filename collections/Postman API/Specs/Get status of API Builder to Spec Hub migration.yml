info:
  name: Get status of API Builder to Spec Hub migration
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/spec-migrations"
  params:
    - name: apiId
      value: ""
      type: path
      description: The API's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/spec-migrations
      method: GET
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "status": "COMPLETED",
              "details": {
                  "workspaceId": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9"
              }
          }
  - name: Migration Failed
    request:
      url: https://api.getpostman.com/apis/:apiId/spec-migrations
      method: GET
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "status": "FAILED",
              "details": {
                  "reason": "Moving to Spec Hub failed. Please try again or contact support."
              }
          }
  - name: Invalid Format
    request:
      url: https://api.getpostman.com/apis/:apiId/spec-migrations
      method: GET
      params:
        - name: apiId
          value: "123"
          type: path
          description: The API's ID.
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "invalidParamsError",
                  "message": "The specified parameter is in an invalid format",
                  "details": {
                      "param": "apiId"
                  }
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/apis/:apiId/spec-migrations
      method: GET
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "detail": "Unauthorized",
              "title": "Unauthorized",
              "type": "https://api.postman.com/problems/unauthorized",
              "instance": "/apis/90ca9f5a-c4c4-11ed-afa1-0242ac120002/spec-migrations",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/apis/:apiId/spec-migrations
      method: GET
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
          description: The API's ID.
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }

docs: Returns the status of an API Builder definition’s migration to Spec Hub.
