info:
  name: Get a spec's files
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/specs/:specId/files"
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response. This value defaults to `10`.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
      disabled: true
    - name: specId
      value: ""
      type: path
      description: The spec's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
