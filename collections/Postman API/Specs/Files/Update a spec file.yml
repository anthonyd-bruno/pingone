info:
  name: Update a spec file
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/specs/:specId/files/:filePath"
  params:
    - name: specId
      value: ""
      type: path
      description: The spec's ID.
    - name: filePath
      value: ""
      type: path
      description: The path to the file.
  body:
    type: json
    data: |-
      {
          "content": "{{fileContent}}",
          "name": "{{fileName}}",
          "type": "{{fileType}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

