              "title": "Malformed request",
              "detail": "File size exceeded the limit of 10 MB",
              "type": "https://api.postman.com/problems/bad-request",
              "status": 400
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/specs/:specId/files
