info:
  name: Get status of an async spec task
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/:elementType/:elementId/tasks/:taskId"
  params:
    - name: elementType
      value: ""
      type: path
      description: "The type of element: `specs` or `collections`"
    - name: elementId
      value: ""
      type: path
      description: The element's ID.
    - name: taskId
      value: ""
      type: path
      description: The task's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Pending Status
    request:
      url: https://api.getpostman.com/:elementType/:elementId/tasks/:taskId
      method: GET
      params:
        - name: elementType
          value: collections
          type: path
        - name: elementId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: taskId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "status": "pending",
              "meta": {
                  "model": "collection",
                  "action": "generation"
              }
          }
  - name: Completed Status
    request:
      url: https://api.getpostman.com/:elementType/:elementId/tasks/:taskId
      method: GET
      params:
        - name: elementType
          value: collections
          type: path
        - name: elementId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: taskId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "meta": {
                  "action": "generation",
                  "model": "collection"
              },
              "details": {
                  "resources": [
                      {
                          "id": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                          "url": "/collections/e726de58-f1b3-4edd-a8a7-2579dc799d39"
                      }
                  ]
              },
              "status": "completed"
          }
  - name: Failed Status
    request:
      url: https://api.getpostman.com/:elementType/:elementId/tasks/:taskId
      method: GET
      params:
        - name: elementType
          value: collections
          type: path
        - name: elementId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: taskId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "details": "Failed to generate collection from specification",
              "meta": {
                  "model": "collection",
                  "action": "generation"
              },
              "status": "failed"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/:elementType/:elementId/tasks/:taskId
      method: GET
      params:
        - name: elementType
          value: collections
          type: path
        - name: elementId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: taskId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "You are not permitted to perform the action.",
              "status": 403,
              "detail": "Please ensure that you have required permissions"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/:elementType/:elementId/tasks/:taskId
      method: GET
      params:
        - name: elementType
          value: collections
          type: path
        - name: elementId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: taskId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "notFoundError",
              "title": "Instance not found",
              "status": 404,
              "detail": "Entity that you are trying to access does not exist."
          }

docs: Gets the status of an asynchronous API specification creation task.
