info:
  name: Delete an API's comment
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/apis/:apiId/comments/:commentId"
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: commentId
      value: "{{commentId}}"
      type: path
      description: The comment's ID.
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

