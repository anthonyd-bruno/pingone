info:
  name: Create an API comment
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/apis/:apiId/comments"
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  body:
    type: json
    data: |-
      {
          "body": "{{comment}}",
          "threadId": {{threadId}},
          "tags": {
              "{{userName}}": {
                  "type": "user",
                  "id": "{{userId}}"
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

