info:
  name: Get a schema
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/schemas/:schemaId"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: versionId
      value: ""
      type: query
      description: The API's version ID.
      disabled: true
    - name: bundled
      value: "true"
      type: query
      description: If true, return the schema in a bundled format.
      disabled: true
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: schemaId
      value: "{{schemaId}}"
      type: path
      description: The API schema's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

