      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  body:
    type: json
    data: |-
      {
          "type": "{{schemaType}}",
          "files": [
              {
                  "path": "{{filePath1}}",
                  "content": "{{content1}}"
              },
              {
                  "path": "{{filePath2}}",
                  "content": "{{content2}}"
              },
              {
                  "path": "{{filePath3}}",
                  "content": "{{content3}}"
              },
              {
                  "path": "{{filePath4}}",
                  "content": "{{content4}}"
              }
          ]
      }
