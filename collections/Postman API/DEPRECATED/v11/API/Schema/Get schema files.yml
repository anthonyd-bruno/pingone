info:
  name: Get schema files
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/schemas/:schemaId/files"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response. This value defaults to `10`.
      disabled: true
    - name: versionId
      value: ""
      type: query
      description: The API's version ID.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results.
      disabled: true
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: schemaId
      value: "{{schemaId}}"
      type: path
      description: The API schema's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files?versionId=66ae9950-0869-4e65-96b0-1e0e47e771af&limit=2&cursor=eyJzY2hlbWUiOiJwYXRoX2FzYyIsImRpcmVjdGlvblR5cGUiOiJuZXh0IiwicGl2b3QiOiJwYXRoIiwidmFsdWUiOiJkaXIvczEuanNvbiJ9
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: versionId
          value: 66ae9950-0869-4e65-96b0-1e0e47e771af
          type: query
        - name: limit
          value: "2"
          type: query
        - name: cursor
          value: eyJzY2hlbWUiOiJwYXRoX2FzYyIsImRpcmVjdGlvblR5cGUiOiJuZXh0IiwicGl2b3QiOiJwYXRoIiwidmFsdWUiOiJkaXIvczEuanNvbiJ9
          type: query
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "meta": {
                  "nextCursor": "eyJzY2hlbWUiOiJwYXRoX2FzYyIsImRpcmVjdGlvblR5cGUiOiJuZXh0IiwicGl2b3QiOiJwYXRoIiwidmFsdWUiOiJOZXdQZXQuanNvbiJ9"
              },
              "files": [
                  {
                      "id": "e8a015e0-f472-4bb3-a523-57ce7c4583ed",
                      "path": "data-model/error.yaml",
                      "name": "error.yaml",
                      "createdAt": "2022-03-29T11:37:15Z",
                      "updatedAt": "2022-03-29T11:37:15Z",
                      "createdBy": 2345,
                      "updatedBy": 2345
                  },
                  {
                      "id": "e8a015e0-f472-4bb3-a523-57ce7c4583ef",
                      "path": "data-model/error2.yaml",
                      "name": "error2.yaml",
                      "createdAt": "2022-03-29T11:37:15Z",
                      "updatedAt": "2022-03-29T11:37:15Z",
                      "createdBy": 2345,
                      "updatedBy": 2345
                  }
              ]
          }
  - name: Schema Not Linked to API
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "invalidParamError",
              "title": "Invalid param error",
              "detail": "Schema is not linked to the API"
          }
  - name: Invalid Version ID
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files?versionId=e8a015e0-f472
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: versionId
          value: e8a015e0-f472
          type: query
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "invalidParamError",
              "title": "Invalid version Id provided",
              "detail": "Schema not published in this version"
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "API not found. For v10 and later APIs, ensure that your request sends the \"application/vnd.api.v10+json\" Accept header."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "title": "You are not permitted to perform the action.",
              "detail": "Please ensure that you have required permissions",
              "type": "ForbiddenError"
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: API Not Found
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "Resource not found",
              "detail": "We could not find the API you are looking for"
          }
  - name: Git-Linked API Errror
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
    response:
      statusText: "422"
      body:
        type: text
        data: |-
          {
              "detail": "This action is not allowed for git linked APIs",
              "type": "actionNotAllowedError",
              "title": "Action not allowed"
          }

docs: |-
  Gets the files in an API schema. You can use the `versionId` query parameter to get schema files published in an API version.

  **Note:**

  The `versionId` query parameter is a **required** parameter for API viewers.
