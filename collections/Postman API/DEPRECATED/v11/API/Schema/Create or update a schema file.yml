info:
  name: Create or update a schema file
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/apis/:apiId/schemas/:schemaId/files/:filePath"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: schemaId
      value: "{{schemaId}}"
      type: path
      description: The API schema's ID.
    - name: filePath
      value: "{{filePath}}"
      type: path
      description: The path to the schema file.
  body:
    type: json
    data: |-
      {
          "content": "{{fileContent}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

