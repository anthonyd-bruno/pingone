info:
  name: Delete a schema file
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/apis/:apiId/schemas/:schemaId/files/:filePath"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: schemaId
      value: "{{schemaId}}"
      type: path
      description: The API schema's ID.
    - name: filePath
      value: "{{filePath}}"
      type: path
      description: The path to the schema file.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Deleted
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files/:filePath
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
        - name: filePath
          value: data-model/index.json
          type: path
    response:
      statusText: "204"
      body:
        type: text
        data: ""
  - name: Schema Not Linked to API
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files/:filePath
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: schemaId
          value: 5381f010-c4c1-11ed-afa1-0242ac120002
          type: path
        - name: filePath
          value: data-model/index.json
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "invalidParamError",
              "title": "Invalid param error",
              "detail": "Schema is not linked to the API"
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId/schemas/:schemaId/files/:filePath
      method: DELETE
