info:
  name: Delete a version
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/apis/:apiId/versions/:versionId"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: versionId
      value: "{{versionId}}"
      type: path
      description: The API's version ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Deleted
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "204"
      body:
        type: text
        data: ""
  - name: API Not Found
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "We could not find the API version you are looking for"
              }
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: DELETE
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
      body:
        type: json
        data: ""
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "API not found. For v10 and later APIs, ensure that your request sends the \"application/vnd.api.v10+json\" Accept header."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
      body:
        type: json
        data: ""
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "forbiddenError",
              "title": "Forbidden",
              "detail": "You do not have permission to perform this action"
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/apis/:apiId/versions/:versionId
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
      body:
        type: json
        data: ""
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: VersionNotFound Error When API Version is Pending Publishing
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: DELETE
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "VersionNotFound",
              "title": "API Version not found.",
              "details": "We could not find the API Version you are looking for."
          }

docs: |-
  Deletes an API version. On success, this returns an HTTP `204 No Content` response.

  **Note:**

  This endpoint returns an HTTP `404 Not Found` response when an API version is pending publication.
