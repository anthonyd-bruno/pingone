info:
  name: Create a version
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/apis/:apiId/versions"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  body:
    type: json
    data: |-
      {
          "name": "{{apiReleaseName}}",
          "releaseNotes": "{{apiReleaseDescription}}",
          "collections": [
              {
                  "id": "{{collectionUid}}"
              }
          ],
          "schemas": [
              {
                  "id": "{{schemaId}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

