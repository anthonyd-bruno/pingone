info:
  name: Get a version
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/versions/:versionId"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: versionId
      value: "{{versionId}}"
      type: path
      description: The API's version ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "version": {
                  "createdAt": "2022-06-09T14:48:45.000Z",
                  "updatedAt": "2022-06-09T19:50:49.000Z",
                  "id": "3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2",
                  "name": "Release 1.0",
                  "releaseNotes": "This is the first release.",
                  "schemas": [
                      {
                          "id": "13a441a3-6109-4f78-86eb-e0144d0ff275",
                          "type": "openapi:3"
                      }
                  ],
                  "collections": [
                      {
                          "id": "12345678-aeedb353-494b-4424-82cf-358aece2bd1c",
                          "name": "collection1"
                      }
                  ]
              }
          }
  - name: Version in Pending Status Response
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "302"
      headers:
        - name: Location
          value: /apis/5360b75f-447e-467c-9299-12fd6c92450d/tasks/3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
      body:
        type: text
        data: ""
  - name: Successful Response for API Viewers
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "version": {
                  "createdAt": "2022-06-09T14:48:45.000Z",
                  "updatedAt": "2022-06-09T19:50:49.000Z",
                  "id": "3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2",
                  "name": "Release 1.0",
                  "releaseNotes": "This is the first release.",
                  "schemas": [
                      {
                          "id": "C1",
                          "type": "openapi:3"
                      }
                  ],
                  "collections": [
                      {
                          "id": "C1",
                          "name": "collection1"
                      },
                      {
                          "id": "C2",
                          "name": "collection2"
                      }
                  ]
              }
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: GET
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "API not found. For v10 and later APIs, ensure that your request sends the \"application/vnd.api.v10+json\" Accept header."
              }
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/apis/:apiId/versions/:versionId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/apis/:apiId/versions/:versionId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
        - name: versionId
          value: 3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "VersionNotFound",
              "title": "API Version not found.",
              "details": "We could not find the API Version you are looking for."
          }

docs: |-
  Gets information about an API version.

  **Note:**

  - For API editors, this endpoint returns an HTTP `302 Found` status code when the version status is pending. It also returns the `/apis/{apiId}/tasks/{taskId}` task status response header.
  - For API viewers, this endpoint returns an HTTP `404 Not Found` when the version status is pending.
