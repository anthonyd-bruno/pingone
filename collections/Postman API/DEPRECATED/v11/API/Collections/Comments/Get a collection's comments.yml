info:
  name: Get a collection's comments
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/collections/:collectionId/comments"
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: collectionId
      value: "{{collectionUid}}"
      type: path
      description: The collection's unique ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/comments
      method: GET
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "id": 46818,
                      "threadId": 12345,
                      "status": "Open",
                      "createdBy": 12345678,
                      "createdAt": "2024-01-18T12:00:54.000Z",
                      "updatedAt": "2024-01-18T12:00:54.000Z",
                      "body": "This is also an example."
                  },
                  {
                      "id": 46817,
