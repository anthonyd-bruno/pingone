info:
  name: Update a collection's comment
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/apis/:apiId/collections/:collectionId/comments/:commentId"
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
    - name: collectionId
      value: "{{collectionUid}}"
      type: path
      description: The collection's unique ID.
    - name: commentId
      value: "{{commentId}}"
      type: path
      description: The comment's ID.
  body:
    type: json
    data: |-
      {
          "body": "{{comment}}",
          "tags": {
              "{{userName}}": {
                  "type": "user",
                  "id": "{{userId}}"
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

