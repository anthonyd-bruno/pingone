info:
  name: Add a collection
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/apis/:apiId/collections"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  body:
    type: json
    data: |-
      {
            "operationType": "COPY_COLLECTION",
            "data": {
              "collectionId": "{{collectionId}}"
            }
          }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
