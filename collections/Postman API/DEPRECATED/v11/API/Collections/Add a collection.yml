    request:
      url: https://api.getpostman.com/apis/:apiId/collections
      method: POST
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 90ca9f5a-c4c4-11ed-afa1-0242ac120002
          type: path
      body:
        type: json
        data: |-
          {
            "operationType": "COPY_COLLECTION",
            "data": {
              "collectionId": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
            }
          }
    response:
      statusText: "201"
      body:
