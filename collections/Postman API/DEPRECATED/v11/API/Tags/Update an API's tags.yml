    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: PUT
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "oS1Z9gHS9lDaAhX3xu0ekJRZwt0CPIikGYApohSPJVu3n3iiHxdISMqMFVo6wPf8N"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "title": "Bad Request",
              "detail": "body/tags/0/slug must NOT have more than 64 characters",
              "status": 400
          }
  - name: Exceeds Max Number of Tags
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: PUT
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/badrequest",
              "title": "Bad Request",
              "detail": "Tags max length of 5 exceeded",
              "status": 400
          }
  - name: Special Character Present
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: PUT
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "test-api!"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "title": "Bad Request",
              "detail": "body/tags/0/slug must match pattern \"^[a-z][a-z0-9-]*[a-z0-9]+$\"",
