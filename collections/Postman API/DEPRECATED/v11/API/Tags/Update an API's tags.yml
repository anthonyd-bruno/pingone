info:
  name: Update an API's tags
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/apis/:apiId/tags"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  body:
    type: json
    data: |-
      {
          "tags": [
              {
                  "slug": "{{tagName}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: PUT
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  }
              ]
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  }
              ]
          }
