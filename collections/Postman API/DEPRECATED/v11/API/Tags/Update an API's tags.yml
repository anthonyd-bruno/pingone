      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
      body:
        type: json
        data: "{}"
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "statusCode": 400,
              "error": "Bad Request",
              "message": "body must have required property 'tags'"
