info:
  name: Get an API's tags
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId/tags"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  }
              ]
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "API not found. For v10 and later APIs, ensure that your request sends the \"application/vnd.api.v10+json\" Accept header."
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "status": 401
          }
  - name: Invalid Credentials
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "The request lacks valid credentials.",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Access Denied",
              "detail": "You do not have developer role. Ask your (super)admin to grant you developer role",
              "status": 403
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: Not Enterprise
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Access Denied",
              "detail": "The tags feature is only available to enterprise teams",
              "status": 403
          }
  - name: No View Permissions
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Access Denied",
              "status": 403,
              "detail": "You do not have view permission",
              "instance": "/tags/apis/12345678-90ca9f5a-c4c4-11ed-afa1-0242ac120002"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/not-found",
              "title": "Resource Not Found",
              "detail": "Slug 'needs-review' does not exist",
              "status": 404,
              "instance": "/slugs/needs-review/entities"
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/apis/:apiId/tags
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 6fd634a3-79ba-451d-8f07-56a953f96667
          type: path
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/internal-server-error",
              "title": "Internal Server Error",
              "status": 500
          }

docs: Gets all the tags associated with an API.
