  - name: Git-Linked API with a Schema Folder
    request:
      url: https://api.getpostman.com/apis/:apiId?include=schemas,collections,versions,gitInfo
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: include
          value: schemas,collections,versions,gitInfo
