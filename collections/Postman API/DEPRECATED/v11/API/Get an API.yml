info:
  name: Get an API
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/apis/:apiId"
  headers:
    - name: Accept
      value: application/vnd.api.v10+json
      description: The request header required to use the endpoint.
  params:
    - name: include
      value: ""
      type: query
      description: "A comma-separated list of one or more of the following additional resources to include in the response. Use this parameter to query for element links to the API, such as collections and schemas:

        - `collections` — Query for linked Postman collections.

        - `versions` — Query for linked versions.

        - `schemas` — Query for linked schemas.

        - `gitInfo` — Query for information about the API’s git-linked repository. This query only returns the linked repository  and folder locations of the files. It does **not** return `collections` or `schemas` information.


        **Note:**

        API viewers can only use the `versions` option.

        \        "
      disabled: true
    - name: apiId
      value: "{{apiId}}"
      type: path
      description: The API's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/:apiId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "description": "This is a test API.",
              "id": "5360b75f-447e-467c-9299-12fd6c92450d",
              "updatedBy": "12345678",
              "createdBy": "12345678",
              "createdAt": "2022-06-09T14:48:45.000Z",
              "name": "Test API",
              "summary": "Test API.",
              "updatedAt": "2022-06-09T19:50:49.000Z"
          }
  - name: With include Parameter
    request:
      url: https://api.getpostman.com/apis/:apiId?include=schemas,collections,versions,gitInfo
      method: GET
      headers:
