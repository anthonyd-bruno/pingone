              "collections": [
                  {
                      "id": "16bb367e-fafb-4ef3-933b-ee3d971866fb"
                  }
              ],
              "gitInfo": {},
              "schemas": [
                  {
                      "id": "ae2b9ab2-28f2-401d-912f-eca09a78e98b"
                  }
              ],
              "versions": [
                  {
                      "id": "18ccb2dc-1746-4945-ba76-8152b37cr123",
                      "name": "v1.0.0"
                  }
              ],
              "createdAt": "2022-06-09T14:48:45.000Z",
              "summary": "Test API."
          }
