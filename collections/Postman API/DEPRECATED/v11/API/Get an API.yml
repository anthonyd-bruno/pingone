  - name: Response for API Viewers
    request:
      url: https://api.getpostman.com/apis/:apiId?include=versions
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: include
          value: versions
          type: query
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "createdAt": "2022-06-09T14:48:45.000Z",
              "updatedAt": "2022-06-09T19:50:49.000Z",
              "id": "5360b75f-447e-467c-9299-12fd6c92450d",
              "name": "Test API",
              "summary": "Test API.",
              "description": "This is a test API.",
              "createdBy": "12345678",
              "updatedBy": "12345678",
              "versions": [
                  {
                      "id": "18ccb2dc-1746-4945-ba76-8152b37cr123",
                      "name": "v1.0.0"
                  },
                  {
                      "id": "5260b75f-447e-467c-9299-12f16c924503",
                      "name": "v1.0.1"
                  }
              ]
          }
  - name: Missing v10 Accept Header
    request:
      url: https://api.getpostman.com/apis/:apiId
      method: GET
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "API not found. For v10 and later APIs, ensure that your request sends the \"application/vnd.api.v10+json\" Accept header."
              }
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/apis/:apiId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: API Not Found
    request:
      url: https://api.getpostman.com/apis/:apiId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "instanceNotFoundError",
              "title": "We could not find the API you are looking for",
              "detail": "We could not find the API you are looking for."
          }
  - name: v9 Unsupported
    request:
      url: https://api.getpostman.com/apis/:apiId
      method: GET
      headers:
        - name: Accept
          value: application/vnd.api.v10+json
      params:
        - name: apiId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
    response:
      statusText: "422"
      body:
        type: text
        data: |-
          {
              "type": "unsupportedEntityError",
              "title": "Unsupported API",
              "detail": "This endpoint does not support v9 APIs."
          }

docs: |-
  Gets information about an API.

  **Note:**

  - Git-connected APIs will **only** return the `versions` and `gitInfo` query responses. This is because schema and collection information is stored in the connected Git repository. The `gitInfo` object only lists the repository and folder locations of the files.
  - API viewers can only use the `versions` option in the `include` query parameter.
