info:
  name: Merge a collection fork
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/collections/merge"
  body:
    type: json
    data: |-
      {
          "strategy": "{{mergeStrategy}}",
          "source": "{{sourceCollectionId}}",
          "destination": "{{destinationCollectionUid}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

