info:
  name: Update an element or folder
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/network/private/:elementType/:elementId"
  params:
    - name: elementType
      value: "{{elementType}}"
      type: path
      description: "The element type: `api`, `folder`, `collection`, or `workspace`"
    - name: elementId
      value: "{{elementId}}"
      type: path
      description: The element's ID or UUID. For Postman Collections you must pass the collection's UID (`userId`-`collectionId`) value.
  body:
    type: json
    data: |-
      {
          "{{elementType}}": {
              "parentFolderId": {{parentFolderId}}
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update an API
    request:
      url: https://api.getpostman.com/network/private/:elementType/:elementId
      method: PUT
      params:
        - name: elementType
          value: api
          type: path
        - name: elementId
          value: 5360b75f-447e-467c-9299-12fd6c92450d
          type: path
      body:
        type: json
        data: |-
          {
              "api": {
                  "parentFolderId": 1
              }
          }
    response:
      statusText: "200"
      body:
