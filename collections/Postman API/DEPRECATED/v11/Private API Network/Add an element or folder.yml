info:
  name: Add an element or folder
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/network/private"
  body:
    type: json
    data: |-
      {
          "{{elementType}}": {
              "id": "{{elementId}}",
              "parentFolderId": {{parentFolderId}}
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
