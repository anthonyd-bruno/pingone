  - name: Unauthorized
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
                  "message": "Invalid API Key. Every request requires a valid API Key to be sent."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "forbiddenError",
                  "message": "You do not have enough permissions to perform this action."
              }
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "serverError",
                  "message": "An error has occurred on the server."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: |-
  Gets information about the folders and elements added to your team's [Private API Network](https://learning.postman.com/docs/collaborating-in-postman/adding-private-network/). Elements are APIs, collections, and workspaces.

  **Note:**

  The `limit` and `offset` parameters are separately applied to elements and folders. For example, if you query a `limit` value of `10` and an `offset` value `0`, the endpoint returns 10 elements and 10 folders for a total of 20 items. The `totalCount` property in the `meta` response is the total count of **both** elements and folders.
