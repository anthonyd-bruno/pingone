info:
  name: Create an API
  type: http
  seq: 6

http:
  method: POST
  url: https://api.getpostman.com/apis
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: workspaceId
      value: "{{workspaceId}}"
      type: query
      description: |-
        Optional. The workspace ID in which to create the API.

        If you do not use this parameter, the system creates the API in the "My Workspace" workspace.
      disabled: true
  body:
    type: json
    data: |-
      {
          "api": {
              "name": "{{apiName}}",
              "summary": "{{apiSummary}}",
              "description": "{{apiDescription}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
          description: |-
            Optional. The workspace ID in which to create the API.

            If you do not use this parameter, the system creates the API in the "My Workspace" workspace.
          disabled: true
      body:
        type: json
        data: |-
          {
              "api": {
                  "name": "Test API",
                  "summary": "Test API Schema",
                  "description": "This is a test API."
              }
          }
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
