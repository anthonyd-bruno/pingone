info:
  name: Get all test relations
  type: http
  seq: 7

http:
  method: GET
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/test
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/387c2863-6ee3-4a56-8210-225f774edade/versions/a9879d02-74bf-425a-bbec-6d27aa135507/test
      method: GET
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "test": [
                  {
                      "id": "12ece9e1-2abf-4edc-8e34-de66e74114d2",
                      "name": "Test Collection",
                      "updatedAt": "2022-07-08T18:32:23.000Z",
                      "collectionId": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
                  }
              ]
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/apis/387c2863-6ee3-4a56-8210-225f774edade/versions/a9879d02-74bf-425a-bbec-6d27aa135507/test
      method: GET
    response:
      statusText: "429"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: |-
  **This endpoint is deprecated in Postman v10 and higher.**

  Gets all of an API version's test relations.
