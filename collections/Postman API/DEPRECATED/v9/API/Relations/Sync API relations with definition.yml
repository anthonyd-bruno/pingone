info:
  name: Sync API relations with definition
  type: http
  seq: 8

http:
  method: PUT
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/:relationType/:entityId/syncWithSchema
  params:
    - name: relationType
      value: unclassified
      type: path
      description: |-
        The `unclassified` relation type. This relation is used for documentation and testing.

        **Note:**

        In Postman v10 and earlier, this value is one of:
        * `documentation`
        * `test`
        * `mock`
        * `monitor`
    - name: entityId
      value: "{{entityId}}"
      type: path
      description: |-
        The collection's UID value.

        **Note:**

        In Postman v10 and earlier, the entity's ID value is one of the following, based on its relation type:
        * `documentation` and `test` — The collection UID value.
        * `environment` — The environment UID value.
        * `mock` — The mock ID value.
        * `monitor` — The monitor ID value.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/4ebb45f8-7bb3-4a63-9c42-0b1602818293/versions/5e154147-b571-4ffe-a6ac-df2ab3b6e5ba/:relationType/:entityId/syncWithSchema
      method: PUT
      params:
        - name: relationType
          value: unclassified
          type: path
        - name: entityId
          value: 12345678-b4abc083-3ee2-4fc2-8959-29a7653a1c91
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "success": true
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/apis/4ebb45f8-7bb3-4a63-9c42-0b1602818293/versions/5e154147-b571-4ffe-a6ac-df2ab3b6e5ba/:relationType/:entityId/syncWithSchema
      method: PUT
      params:
        - name: relationType
          value: unclassified
          type: path
        - name: entityId
          value: 12345678-b4abc083-3ee2-4fc2-8959-29a7653a1c91
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
