info:
  name: Create relations
  type: http
  seq: 11

http:
  method: POST
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/relations
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "{{relationType}}": [
              "{{entityId}}"
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

