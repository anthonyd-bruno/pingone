info:
  name: Create an API release
  type: http
  seq: 3

http:
  method: POST
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/releases
  body:
    type: json
    data: |-
      {
          "release": {
              "name": "{{apiReleaseName}}",
              "summary": "{{apiReleaseSummary}}",
              "description": "{{apiReleaseDescription}}",
              "visibility": "{{apiReleaseVisibility}}",
              "gitTag": "{{apiReleaseGitTag}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/387c2863-6ee3-4a56-8210-225f774edade/versions/a9879d02-74bf-425a-bbec-6d27aa135507/releases
      method: POST
      body:
        type: json
        data: |-
          {
              "release": {
                  "id": "3563baaa-07a2-46ed-9fd2-0e8a3c5f7ec2",
                  "name": "Release 1.0",
                  "summary": "This is the first release.",
                  "description": "This is the first release of the Test API. For more information, read the documentation.",
                  "visibility": "public",
                  "gitTag": "release"
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
