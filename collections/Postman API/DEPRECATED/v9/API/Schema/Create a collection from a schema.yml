info:
  name: Create a collection from a schema
  type: http
  seq: 3

http:
  method: POST
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/schemas/{{schemaId}}/collections
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: workspaceId
      value: "{{workspaceId}}"
      type: query
      description: |-
        Optional. The workspace ID in which to created the collection.

        If you do not include this query parameter, the system defaults to the "My Workspace" workspace.
      disabled: true
  body:
    type: json
    data: |-
      {
      	"name": "{{collectionName}}",
      	"relations": [
      		{
      			"type": "{{relationType}}"
      		}	
      	],
          "options": {
              "{{optionName}}": "{{optionValue}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

