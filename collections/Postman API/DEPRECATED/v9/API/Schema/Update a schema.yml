info:
  name: Update a schema
  type: http
  seq: 4

http:
  method: PUT
  url: https://api.getpostman.com/apis/{{apiId}}/versions/{{apiVersionId}}/schemas/{{schemaId}}
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
      	"schema": {
      		"language": "{{apiDefinitionLanguage}}",
              "schema": "{{apiDefinition}}",
      		"type": "{{apiDefinitionType}}"
      	}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

