info:
  name: Create an API version
  type: http
  seq: 2

http:
  method: POST
  url: https://api.getpostman.com/apis/{{apiId}}/versions
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
      	"version": {
      		"name": "{{apiVersionName}}",
      		"source": {
      			"id": "{{apiVersionId}}",
      			"schema": {{boolean}},
      			"relations": {
      				"monitor": {{boolean}},
      				"mock": {{boolean}},
      				"documentation": {{boolean}},
                      "test": {{boolean}},
                      "environment": {{boolean}}
      			}
      		}
      	}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/apis/387c2863-6ee3-4a56-8210-225f774edade/versions
      method: POST
      body:
        type: json
        data: |-
          {
              "version": {
                  "name": "v1",
                  "source": {
                      "id": "a9879d02-74bf-425a-bbec-6d27aa135507",
                      "schema": true,
                      "relations": {
                          "documentation": true,
                          "environment": true,
                          "mock": true,
                          "monitor": true
                      }
                  }
              }
          }
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "version": {
                  "id": "8421a1f3-3262-4d47-a597-7005bf4c1564",
                  "name": "v1",
                  "api": "387c2863-6ee3-4a56-8210-225f774edade"
              }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/apis/387c2863-6ee3-4a56-8210-225f774edade/versions
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "version": {
                  "name": "v1",
                  "source": {
                      "id": "a9879d02-74bf-425a-bbec-6d27aa135507",
                      "schema": true,
                      "relations": {
                          "documentation": true,
                          "environment": true,
                          "mock": true,
                          "monitor": true
