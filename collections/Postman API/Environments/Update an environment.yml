info:
  name: Update an environment
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/environments/:environmentId"
  params:
    - name: environmentId
      value: ""
      type: path
      description: The environment's ID.
  body:
    type: json
    data: |-
      [
          {
              "op": "{{operationType}}",
              "path": "{{environmentPath}}",
              "value": "{{value}}"
          }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

