          type: path
      body:
        type: json
        data: |-
          [
              {
                  "op": "replace",
                  "path": "/name",
                  "value": "Test API Environment"
              }
          ]
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "environment": {
                  "id": "5daabc50-8451-43f6-922d-96b403b4f28e",
