info:
  name: Delete an environment
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/environments/:environmentId"
  params:
    - name: environmentId
      value: ""
      type: path
      description: The environment's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/environments/:environmentId
      method: DELETE
      params:
        - name: environmentId
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "environment": {
                  "id": "5daabc50-8451-43f6-922d-96b403b4f28e",
                  "uid": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e"
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/environments/:environmentId
      method: DELETE
      params:
        - name: environmentId
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "The specified environment does not exist."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/environments/:environmentId
      method: DELETE
      params:
        - name: environmentId
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

