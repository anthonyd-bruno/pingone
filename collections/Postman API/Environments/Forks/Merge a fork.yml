info:
  name: Merge a fork
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/environments/:environmentUid/merges"
  params:
    - name: environmentUid
      value: ""
      type: path
      description: The environment's unique ID.
  body:
    type: json
    data: |-
      {
          "source": "{{environmentUid}}",
          "deleteSource": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/environments/:environmentUid/merges
      method: POST
      params:
        - name: environmentUid
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
      body:
        type: json
        data: |-
          {
              "source": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957",
              "deleteSource": false
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "environment": {
                  "uid": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957"
              }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/environments/:environmentUid/merges
      method: POST
      params:
        - name: environmentUid
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
      body:
        type: json
        data: |-
          {
              "source": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957",
              "deleteSource": false
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/bad-request",
              "title": "The environment Id is not a forked environment.",
              "detail": {}
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/environments/:environmentUid/merges
      method: POST
      params:
        - name: environmentUid
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
      body:
        type: json
        data: |-
          {
              "source": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957",
              "deleteSource": false
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
                  "message": "Invalid API Key. Every request requires a valid API Key to be sent."
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/environments/:environmentUid/merges
      method: POST
      params:
        - name: environmentUid
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
      body:
        type: json
        data: |-
          {
              "source": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957",
              "deleteSource": false
          }
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "title": "Not Found",
              "status": 404,
              "detail": "We could not find the environment you are looking for",
              "type": "https://api.postman.com/problems/notFound"
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/environments/:environmentUid/merges
      method: POST
      params:
        - name: environmentUid
          value: 12345678-5daabc50-8451-43f6-922d-96b403b4f28e
          type: path
      body:
        type: json
        data: |-
          {
              "source": "12345678-d9c7dc8f-904e-4bba-99b5-4d490aae1957",
              "deleteSource": false
          }
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/internal-server-error",
              "title": "Internal Server Error",
              "detail": "Internal Server Error"
          }

docs: "[Merges](https://learning.postman.com/docs/collaborating-in-postman/using-version-control/forking-elements/#merge-changes-from-a-fork) a forked environment back into its parent environment."
