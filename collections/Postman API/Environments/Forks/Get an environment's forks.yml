info:
  name: Get an environment's forks
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/environments/:environmentUid/forks"
  params:
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: Sort results in ascending (`asc`) or descending (`desc`) order.
      disabled: true
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response. This value defaults to 10.
      disabled: true
    - name: sort
      value: createdAt
      type: query
      description: Sort the results by the date and time of creation.
      disabled: true
    - name: environmentUid
      value: ""
      type: path
      description: The environment's unique ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

