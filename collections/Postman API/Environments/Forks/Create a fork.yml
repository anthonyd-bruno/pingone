      body:
        type: json
        data: |-
          {
              "forkName": "My fork"
          }
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "title": "Not Found",
              "status": 404,
              "detail": "We could not find the environment you are looking for",
              "type": "https://api.postman.com/problems/notFound"
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/environments/:environmentUid/forks?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
