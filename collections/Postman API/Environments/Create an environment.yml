                          "type": "default"
                      },
                      {
                          "key": "variable_1",
                          "value": "The variable_1 value.",
                          "enabled": false,
                          "type": "default"
                      }
                  ]
              }
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "malformedRequestError",
                  "message": "Found 1 errors with the supplied environment.",
                  "details": [
                      "environment: must have required property 'name'"
                  ]
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/environments?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
