                      {
                          "key": "collectionId",
                          "value": "12ece9e1-2abf-4edc-8e34-de66e74114d2",
                          "enabled": true,
                          "type": "default"
                      },
                      {
                          "key": "variable_1",
                          "value": "The variable_1 value.",
                          "enabled": false,
                          "type": "default"
                      }
                  ]
              }
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "forbiddenError",
                  "message": "You are not permitted to perform the action."
              }
          }
  - name: Length Required
    request:
      url: https://api.getpostman.com/environments?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
