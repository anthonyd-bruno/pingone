info:
  name: Get all team users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  params:
    - name: groupId
      value: ""
      type: query
      description: Filter results by the given group ID. To get group IDs, use the GET `/groups` endpoint.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/users
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "id": 1,
                      "name": "Taylor Lee",
                      "username": "taylor-lee",
                      "email": "taylor.lee@example.com",
                      "roles": [
                          "admin",
                          "user"
                      ],
                      "joinedAt": "2022-11-23T14:38:25.000Z"
                  },
                  {
                      "id": 2,
                      "name": "Alex Cruz",
                      "username": "alex-cruz",
                      "email": "alex.cruz@example.com",
                      "roles": [
                          "user"
                      ],
                      "joinedAt": "2022-11-24T10:18:11.000Z"
                  }
              ]
          }
  - name: Filter by groupId
    request:
      url: https://api.getpostman.com/users?groupId=123
      method: GET
      params:
        - name: groupId
          value: "123"
          type: query
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "id": 1,
                      "name": "Taylor Lee",
                      "username": "taylor-lee",
                      "email": "taylor.lee@example.com",
                      "roles": [
                          "admin",
                          "user"
                      ],
                      "joinedAt": "2022-11-23T14:38:25.000Z"
                  }
              ]
          }
  - name: No Group Found
    request:
      url: https://api.getpostman.com/users?groupId=123
      method: GET
      params:
        - name: groupId
          value: "123"
          type: query
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": []
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/users
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "Unauthorized",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/users
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/users
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/internal-server-error",
              "title": "Internal Server Error",
              "detail": "Internal Server Error",
              "status": 500
          }

docs: Gets information about all users on the [Postman team](https://learning.postman.com/docs/collaborating-in-postman/working-with-your-team/collaboration-overview/).
