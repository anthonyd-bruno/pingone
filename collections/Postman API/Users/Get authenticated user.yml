  - name: Guest and Partner User Response
    request:
      url: https://api.getpostman.com/me
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "user": {
                  "id": 12345678,
                  "sub": "4d71435e-0e67-45b9-9d4c-e3262166d157",
                  "username": "taylor-lee",
                  "email": "taylor.lee@example.com",
                  "fullName": "Taylor Lee",
                  "avatar": null,
                  "isPublic": true,
                  "emailVerified": true,
                  "teamId": 123,
                  "teamName": "Test Team",
                  "teamDomain": "test-team",
                  "roles": [
                      "user"
                  ]
              }
          }
  - name: No Assigned Team
    request:
      url: https://api.getpostman.com/me
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "user": {
                  "id": 12345678,
                  "sub": "4d71435e-0e67-45b9-9d4c-e3262166d157",
                  "username": "taylor-lee",
                  "email": "taylor.lee@example.com",
                  "fullName": "Taylor Lee",
                  "avatar": null,
                  "isPublic": true,
                  "emailVerified": true,
                  "teamId": 0,
                  "teamName": "",
                  "teamDomain": "",
                  "roles": [
                      "user"
                  ]
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/me
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
                  "message": "Invalid API Key. Every request requires a valid API Key to be sent."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/me
      method: GET
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: |-
  Gets information about the authenticated user.

  **Note:**

  - This API returns a different response for users with the [Guest and Partner roles](https://learning.postman.com/docs/collaborating-in-postman/roles-and-permissions/#team-roles).
      
  - The `flow_count` response only returns for users on [Free plans](https://www.postman.com/pricing/).
