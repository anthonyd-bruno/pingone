info:
  name: Get authenticated user
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

