info:
  name: Get all add requests
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/network/private/network-entity/request/all"
  params:
    - name: since
      value: ""
      type: query
      description: |-
        Return only results created since the given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be later than the `until` value.

        To use time-numoffset format, you must use `%2B` URL-encoding for the `+` character.
      disabled: true
    - name: until
      value: ""
      type: query
      description: |-
        Return only results created until this given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be earlier than the `since` value.

        To use time-numoffset format, you must use `%2B` URL-encoding for the `+` character.
      disabled: true
    - name: requestedBy
      value: ""
      type: query
      description: Return a user's requests by their user ID.
      disabled: true
    - name: type
      value: workspace
      type: query
      description: The `workspace` value.
      disabled: true
    - name: status
      value: ""
      type: query
      description: "Filter by the request status. One of: `pending`, `denied`."
      disabled: true
    - name: name
      value: ""
      type: query
      description: Return only workspaces whose name includes the given value. Matching is not case-sensitive.
      disabled: true
    - name: sort
      value: ""
      type: query
      description: Sort the results by the `createdAt` or `updatedAt` properties. If you use this query parameter, you must also use the `direction` parameter.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: Sort in ascending (`asc`) or descending (`desc`) order. Matching is not case-sensitive. If you use this query parameter, you must also use the `sort` parameter.
      disabled: true
    - name: offset
      value: ""
      type: query
      description: The zero-based offset of the first item to return. This value defaults to `0`.
      disabled: true
    - name: limit
      value: ""
      type: query
      description: The maximum number of elements to return. If the value exceeds the maximum value of `1000`, then the system uses the `1000` value.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/network/private/network-entity/request/all?since=2024-06-01T13:48:09.000Z&limit=10
      method: GET
      params:
        - name: since
          value: 2024-06-01T13:48:09.000Z
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "requests": [
                  {
                      "id": 1,
                      "createdBy": 87654321,
                      "createdAt": "2024-06-01T08:32:31.000Z",
                      "status": "pending",
                      "element": {
                          "type": "workspace",
                          "id": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
                          "name": "Billing Team Workspace",
                          "summary": "The Billing team's workspace.",
                          "description": null
                      }
                  },
                  {
                      "id": 2,
                      "createdBy": 56781234,
                      "createdAt": "2024-06-09T14:48:45.000Z",
                      "message": "Please approve this workspace",
                      "status": "denied",
                      "element": {
                          "type": "workspace",
                          "id": "360b75f-447e-467c-9299-12fd3c92450d",
                          "name": "Test Workspace",
                          "summary": "This is a test workspace."
                      },
                      "response": {
                          "createdAt": "2024-06-01T08:32:31.000Z",
                          "createdBy": 12345678,
                          "message": "Too many errors, please fix and resubmit"
                      }
                  }
              ],
              "meta": {
                  "limit": 2,
                  "offset": 0,
                  "totalCount": 10
              }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/network/private/network-entity/request/all
      method: GET
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "name": "invalidParamsError",
              "message": "The specified request does not exist."
          }

docs: Gets all requests to add workspaces to your team's [Private API Network](https://learning.postman.com/docs/collaborating-in-postman/adding-private-network/).
