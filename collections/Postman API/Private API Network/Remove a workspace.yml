info:
  name: Remove a workspace
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/network/private/workspace/:workspaceId"
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/network/private/workspace/:workspaceId
      method: DELETE
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "workspace": {
                  "id": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9"
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/network/private/workspace/:workspaceId
      method: DELETE
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "name": "instanceNotFoundError",
              "message": "Instance not found for the model NetworkEntity, id 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/network/private/workspace/:workspaceId
      method: DELETE
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "forbiddenError",
                  "message": "You do not have enough permissions to perform this action."
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/network/private/workspace/:workspaceId
      method: DELETE
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
