info:
  name: Get all workspaces
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/network/private"
  params:
    - name: type
      value: workspace
      type: query
      description: The `workspace` value.
      disabled: true
    - name: name
      value: ""
      type: query
      description: Return only workspaces whose name includes the given value. Matching is not case-sensitive.
      disabled: true
    - name: summary
      value: ""
      type: query
      description: Return only workspaces whose summary includes the given value. Matching is not case-sensitive.
      disabled: true
    - name: description
      value: ""
      type: query
      description: Return only workspaces whose description includes the given value. Matching is not case-sensitive.
      disabled: true
    - name: since
      value: ""
      type: query
      description: Return only results created since the given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be later than the `until` value.
      disabled: true
    - name: until
      value: ""
      type: query
      description: Return only results created until this given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be earlier than the `since` value.
      disabled: true
    - name: addedBy
      value: ""
      type: query
      description: Return only workspaces published by the given user ID.
      disabled: true
    - name: sort
      value: ""
      type: query
      description: |-
        Sort the results by the given value. One of:
        - `createdAt`
        - `updatedAt`

        If you use this query parameter, you must also use the `direction` parameter.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: Sort in ascending (`asc`) or descending (`desc`) order. Matching is not case-sensitive. If you use this query parameter, you must also use the `sort` parameter.
      disabled: true
    - name: createdBy
      value: ""
      type: query
      description: Return only the elements created by the given user ID.
      disabled: true
    - name: offset
      value: ""
      type: query
      description: The zero-based offset of the first item to return. This value defaults to `0`.
      disabled: true
    - name: limit
      value: ""
      type: query
      description: The maximum number of results to return. If the value exceeds the maximum value of `1000`, then the system uses the `1000` value.
      disabled: true
    - name: parentFolderId
      value: ""
      type: query
      description: This parameter is deprecated.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "elements": [
                  {
                      "addedAt": "2024-11-29T06:31:24.000Z",
                      "addedBy": 12345678,
                      "createdBy": 12345678,
                      "createdAt": "2024-11-29T06:31:24.000Z",
                      "updatedBy": 12345678,
                      "updatedAt": "2024-11-29T06:31:24.000Z",
                      "type": "workspace",
                      "id": "5360b75f-447e-467c-9299-12fd6c92450d",
                      "parentFolderId": 0,
                      "name": "Billing Team Workspace",
                      "summary": "The Billing team's workspace.",
                      "description": null,
                      "href": "https://api.getpostman.com/workspaces/1f0df51a-8658-4ee8-a2a1-d2567dfa09a9"
                  },
                  {
                      "addedAt": "2024-11-29T06:31:26.000Z",
                      "addedBy": 12345678,
                      "createdBy": 12345678,
                      "createdAt": "2024-11-29T06:31:26.000Z",
                      "updatedBy": 12345678,
                      "updatedAt": "2024-11-29T06:31:26.000Z",
                      "type": "workspace",
                      "id": "360b75f-447e-467c-9299-12fd3c92450d",
                      "parentFolderId": 0,
                      "name": "Test Workspace",
                      "summary": "This is a test workspace.",
                      "description": null,
                      "href": "https://api.getpostman.com/workspaces/41f6dc6d-d8ab-45c6-8506-74a25acf5d5f"
                  }
              ],
              "folders": [],
              "meta": {
                  "limit": 1000,
                  "offset": 0,
                  "totalCount": 2
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
                  "message": "Invalid API Key. Every request requires a valid API Key to be sent."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "forbiddenError",
                  "message": "You do not have enough permissions to perform this action."
              }
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "serverError",
                  "message": "An error has occurred on the server."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/network/private
      method: GET
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: Gets information workspaces added to your team's [Private API Network](https://learning.postman.com/docs/collaborating-in-postman/adding-private-network/).
