info:
  name: Get all collections
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/collections?workspace="
  params:
    - name: name
      value: ""
      type: query
      description: Filter results by collections that match the given name.
      disabled: true
    - name: workspace
      value: ""
      type: query
      description: Return only results found in the given workspace ID.
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response.
      disabled: true
    - name: offset
      value: ""
      type: query
      description: The zero-based offset of the first item to return.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
