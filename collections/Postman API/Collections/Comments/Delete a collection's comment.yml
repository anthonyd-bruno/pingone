info:
  name: Delete a collection's comment
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/collections/:collectionUid/comments/:commentId"
  params:
    - name: collectionUid
      value: ""
      type: path
      description: The collection's unique ID.
    - name: commentId
      value: ""
      type: path
      description: The comment's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Comment Deleted
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments/:commentId
      method: DELETE
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: commentId
          value: "46814"
          type: path
    response:
      statusText: "204"
      body:
        type: text
        data: ""
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments/:commentId
      method: DELETE
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: commentId
          value: "46814"
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "Unauthorized",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments/:commentId
      method: DELETE
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: commentId
          value: "46814"
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "link":   "https://api.postman.com/problems/forbidden",
              "title":  "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments/:commentId
      method: DELETE
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
