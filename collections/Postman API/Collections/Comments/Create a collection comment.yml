info:
  name: Create a collection comment
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/collections/:collectionUid/comments"
  params:
    - name: collectionUid
      value: ""
      type: path
      description: The collection's unique ID.
  body:
    type: json
    data: |-
      {
          "body": "{{comment}}",
          "threadId": "{{threadId}}",
          "tags": {
              "{{userName}}": {
                  "type": "user",
                  "id": "{{userId}}"
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments
      method: POST
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"body": "This is an example."
          }
    response:
      statusText: "201"
      body:
        type: text
        data: |-
          {
              "data": {
                  "id": 46814,
                  "threadId": 12345,
                  "status": "Open",
                  "createdBy": 12345678,
                  "createdAt": "2024-01-18T11:30:40.000Z",
                  "updatedAt": "2024-01-18T11:30:40.000Z",
                  "body": "This is an example."
              }
          }
  - name: Reply to Comment Thread
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments
      method: POST
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"body": "This is an example.",
              "threadId": 12345
          }
    response:
      statusText: "201"
      body:
        type: text
        data: |-
          {
              "data": {
                  "id": 46814,
                  "threadId": 12345,
                  "status": "Open",
                  "createdBy": 12345678,
                  "createdAt": "2024-01-18T11:30:40.000Z",
                  "updatedAt": "2024-01-18T11:30:40.000Z",
                  "body": "This is an example."
              }
          }
  - name: Tag User in Comment
    request:
      url: https://api.getpostman.com/collections/:collectionUid/comments
      method: PUT
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"body": "This is an example. @alex-cruz",
              "tags": {
                  "@alex-cruz": {
                      "type": "user",
                      "id": "87654321"
                      }
                  }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": {
                  "id": 46814,
                  "threadId": 12345,
                  "status": "Open",
                  "createdBy": 12345678,
                  "createdAt": "2024-01-18T11:30:40.000Z",
                  "updatedAt": "2024-01-18T11:30:40.000Z",
                  "body": "This is an example. @alex-cruz"
