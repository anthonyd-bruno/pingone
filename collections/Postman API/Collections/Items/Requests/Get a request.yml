info:
  name: Get a request
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionId/requests/:requestId"
  params:
    - name: ids
      value: "true"
      type: query
      description: If true, returns only the request properties that contain ID values.
      disabled: true
    - name: uid
      value: "true"
      type: query
      description: If true, returns all IDs in UID format (`userId`-`id`).
      disabled: true
    - name: populate
      value: "true"
      type: query
      description: If true, returns all of a request's contents.
      disabled: true
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
    - name: requestId
      value: ""
      type: path
      description: The request's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

