info:
  name: Create a request
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/collections/:collectionId/requests"
  params:
    - name: folder
      value: ""
      type: query
      description: |-
        The folder ID in which to create the request.

        By default, the system will create the request at the collection level.
      disabled: true
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  body:
    type: json
    data: |-
      {
          "name": "POST request",
          "auth": {
              "type": "apikey",
              "apikey": [
                  {
                      "key": "value",
                      "value": "XXX"
                  },
                  {
                      "key": "key",
                      "value": "api-key"
                  }
              ]
          },
          "events": [
              {
                  "listen": "test",
                  "script": {
                      "exec": [
                          "pm.test(\"Status code is 200\", function () {",
                          "    pm.response.to.have.status(200);",
                          "});"
                      ],
                      "type": "text/javascript"
                  }
              },
              {
                  "listen": "prerequest",
                  "script": {
                      "exec": [
                          ""
                      ],
                      "type": "text/javascript"
                  }
              }
          ],
          "dataMode": "raw",
          "dataOptions": {
              "raw": {
                  "language": "json"
              }
          },
          "rawModeData": "{\n    \"name\": \"{{value}}\",\n    \"email\": \"{{email}}\",\n    \"username\": \"{{username}}\"\n}",
          "description": "This is an example request.",
          "headers": "Content-Type: application/json\n",
          "method": "POST",
          "url": "https://postman-echo.com/user/:id?active={{boolean}}",
          "preRequestScript": "pm.collectionVariables.get(\"id\");",
          "tests": "pm.test(\"Body matches string\", function () {\n    pm.expect(pm.response.text()).to.include(\"string_you_want_to_search\");\n});",
          "queryParams": [
              {
                  "key": "active",
                  "value": true,
                  "description": "",
                  "enabled": false
              }
          ],
          "pathVariables": {
              "id": "{{value}}"
          },
          "pathVariableData": [
              {
                  "key": "id",
                  "value": "{{value}}",
                  "description": "The user's ID."
              }
          ],
          "protocolProfileBehavior": {
              "disableBodyPruning": true
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

