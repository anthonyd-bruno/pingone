info:
  name: Create a folder
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/collections/:collectionId/folders"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  body:
    type: json
    data: |-
      {
          "name": "Test Folder",
          "description": "This is a test collection folder.",
          "auth": {
              "type": "basic",
              "basic": [
                  {
                      "key": "password",
                      "value": "{{basicAuthPassword}}"
                  },
                  {
                      "key": "username",
                      "value": "{{basicAuthUsername}}"
                  }
              ]
          },
          "order": [],
          "folders_order": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

