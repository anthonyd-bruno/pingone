info:
  name: Get a folder's comments
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionUid/folders/:folderUid/comments"
  params:
    - name: collectionUid
      value: ""
      type: path
      description: The collection's unique ID.
    - name: folderUid
      value: ""
      type: path
      description: The folder's unique ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionUid/folders/:folderUid/comments
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: folderUid
          value: 12345678-65a99e60-8e0a-4b6e-b79c-7d8264cc5caa
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "id": 46818,
                      "threadId": 12345,
                      "status": "Open",
                      "createdBy": 12345678,
                      "createdAt": "2024-01-18T12:00:54.000Z",
                      "updatedAt": "2024-01-18T12:00:54.000Z",
                      "body": "This is also an example."
                  },
                  {
                      "id": 46817,
                      "threadId": 67890,
                      "status": "Resolved",
                      "createdBy": 87654321,
                      "createdAt": "2024-01-18T11:48:01.000Z",
                      "updatedAt": "2024-01-18T11:48:01.000Z",
                      "body": "Another example."
                  },
                  {
                      "id": 46814,
                      "threadId": 23456,
                      "status": "Open",
                      "createdBy": 12345678,
                      "createdAt": "2024-01-18T11:30:40.000Z",
                      "updatedAt": "2024-01-18T11:30:40.000Z",
                      "body": "This is an example."
                  }
              ]
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/collections/:collectionUid/folders/:folderUid/comments
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: folderUid
          value: 12345678-65a99e60-8e0a-4b6e-b79c-7d8264cc5caa
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type":   "https://api.postman.com/problems/unauthorized",
              "title":  "Unauthorized",
              "detail": "Unauthorized",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/collections/:collectionUid/folders/:folderUid/comments
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: folderUid
          value: 12345678-65a99e60-8e0a-4b6e-b79c-7d8264cc5caa
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/:collectionUid/folders/:folderUid/comments
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
