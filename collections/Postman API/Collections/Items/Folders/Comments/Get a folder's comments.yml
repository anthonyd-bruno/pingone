      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/not-found",
              "title": "Not Found",
              "detail": "Not Found",
              "status": 404
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/collections/:collectionUid/folders/:folderUid/comments
      method: GET
      params:
        - name: collectionUid
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
