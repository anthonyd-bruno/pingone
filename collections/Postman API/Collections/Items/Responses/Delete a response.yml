    request:
      url: https://api.getpostman.com/collections/:collectionId/responses/:responseId
      method: DELETE
      params:
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
        - name: responseId
          value: cc364734-7dfd-4bfc-897d-be763dcdbb07
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "model_id": "cc364734-7dfd-4bfc-897d-be763dcdbb07",
              "meta": {
                  "model": "response",
                  "action": "destroy"
              },
              "data": {
                  "id": "cc364734-7dfd-4bfc-897d-be763dcdbb07",
