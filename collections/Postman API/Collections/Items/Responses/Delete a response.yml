info:
  name: Delete a response
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/collections/:collectionId/responses/:responseId"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
    - name: responseId
      value: ""
      type: path
      description: The response's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
