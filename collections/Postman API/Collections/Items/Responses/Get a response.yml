info:
  name: Get a response
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionId/responses/:responseId"
  params:
    - name: ids
      value: "true"
      type: query
      description: If true, returns only the response properties that contain ID values.
      disabled: true
    - name: uid
      value: "true"
      type: query
      description: If true, returns all IDs in UID format (`userId`-`id`).
      disabled: true
    - name: populate
      value: "true"
      type: query
      description: If true, returns all of a response's contents.
      disabled: true
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
    - name: responseId
      value: ""
      type: path
      description: The response's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

