info:
  name: Duplicate a collection
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/collections/:collectionId/duplicates"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's unique ID.
  body:
    type: json
    data: |-
      {
          "workspace": "{{workspaceId}}",
          "suffix": "{{suffixText}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionId/duplicates
      method: POST
      params:
        - name: collectionId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
              "workspace": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
              "suffix": "Copy"
          }
    response:
      statusText: "202"
      body:
        type: text
        data: |-
          {
              "task": {
                  "id": "12345678-d2584d81-3283-42d5-9d84-b897257adcf0",
                  "status": "processing"
