info:
  name: Delete a collection access key
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/collection-access-keys/:keyId"
  params:
    - name: keyId
      value: ""
      type: path
      description: The collection access key's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: No Content
    request:
      url: https://api.getpostman.com/collection-access-keys/:keyId
      method: DELETE
      params:
        - name: keyId
          value: Njg5OjU3MDQ1NjYtYmQxZDU3NzktMWVkNS00ZDhjLWI0ZmQtZWRhOGY2Mzg1NTY0
          type: path
    response:
