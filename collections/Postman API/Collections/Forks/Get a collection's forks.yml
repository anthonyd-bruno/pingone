info:
  name: Get a collection's forks
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionId/forks"
  params:
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: Sort the results by creation date in ascending (`asc`) or descending (`desc`) order.
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: The maximum number of rows to return in the response. Thsi value defaults to `10`.
      disabled: true
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionId/forks
      method: GET
      params:
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "forkName": "Collection Fork",
                      "forkId": "12345678-667df1ad-2ee3-7890-b678-7742d82e2e1f",
                      "createdBy": "Taylor Lee",
                      "createdAt": "2023-11-16T09:18:17.000Z"
                  },
                  {
                      "forkName": "Test Fork",
                      "forkId": "87654321-38j9f1ad-2ee3-7890-dv5h-7742d82e2e1f",
                      "createdBy": "Alex Cruz",
                      "createdAt": "2023-11-16T09:16:15.000Z"
                  }
              ],
              "meta": {
                  "total": 2,
                  "nextCursor": null
              }
          }
  - name: Response with cursor
    request:
      url: https://api.getpostman.com/collections/:collectionId/forks?cursor=eyJpZCI6MzMyNzksImZvcmtzQWZ0ZXIiOjIwfQ==
      method: GET
      params:
        - name: cursor
          value: eyJpZCI6MzMyNzksImZvcmtzQWZ0ZXIiOjIwfQ==
          type: query
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
