  - name: Bad Request
    request:
      url: https://api.getpostman.com/collections/:collectionId/forks
      method: GET
      params:
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "badRequest",
                  "message": "This collection has no forks."
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/:collectionId/forks
      method: GET
      params:
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "The specified item does not exist.",
                  "details": {
                      "item": "collection",
                      "id": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
                  }
              }
          }

docs: Gets a collection's forked collections. The response returns data for each fork, such as the fork's ID, the user who forked it, and the fork's creation date.
