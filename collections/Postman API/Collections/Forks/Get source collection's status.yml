info:
  name: Get source collection's status
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/collections/:collectionId/source-status"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionId/source-status
      method: GET
      params:
        - name: collectionId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "collection": {
                  "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2": {
                      "isSourceAhead": false
                  }
              }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/collections/:collectionId/source-status
      method: GET
      params:
        - name: collectionId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "badRequest",
                  "message": "The collection is not a forked collection."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/collections/:collectionId/source-status
      method: GET
      params:
        - name: collectionId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "detail": "You do not have enough permissions to perform this action.",
              "status": 403,
              "title": "Forbidden",
              "type": "https://api.postman.com/problems/forbidden"
          }

docs: |-
  Checks whether there is a change between the forked collection and its parent (source) collection.

  If the value of the `isSourceAhead` property is `true` in the response, then there is a difference between the forked collection and its source collection.

  **Note:**

  This endpoint may take a few minutes to return an updated `isSourceAhead` status.
