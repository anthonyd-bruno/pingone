info:
  name: Get all forked collections
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/collections/collection-forks"
  params:
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: Sort the results by creation date in ascending (`asc`) or descending (`desc`) order.
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: The maximum number of rows to return in the response. Thsi value defaults to `10`.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/collection-forks
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "forkName": "Collection Fork",
                      "forkId": "12345678-667df1ad-2ee3-7890-b678-7742d82e2e1f",
                      "sourceId": "87654321-bd46b634-b347-44d4-aa23-8c71ff4ecc4d",
                      "createdAt": "2023-11-16T09:18:17.000Z"
                  },
                  {
                      "forkName": "Test Fork",
                      "forkId": "12345678-38j9f1ad-2ee3-7890-dv5h-7742d82e2e1f",
                      "sourceId": "87654321-bd46b634-b347-44d4-aa23-8c71ff4ecc4d",
                      "createdAt": "2023-11-16T09:16:15.000Z"
                  }
              ],
              "meta": {
                  "total": 2,
                  "nextCursor": null,
                  "inaccessibleFork": 0
              }
          }
