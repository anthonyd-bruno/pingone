  - name: Bad Request
    request:
      url: https://api.getpostman.com/collections/collection-forks
      method: GET
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "badRequest",
                  "message": "No Postman User found for given filters"
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/collections/collection-forks
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
