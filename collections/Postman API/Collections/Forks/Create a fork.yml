info:
  name: Create a fork
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/collections/fork/:collectionId?workspace="
  params:
    - name: workspace
      value: ""
      type: query
      description: The workspace ID in which to fork the collection.
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  body:
    type: json
    data: |-
      {
      	"label": "{{collectionForkName}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/fork/:collectionId?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"label": "Test Fork"
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "collection": {
                  "id": "09547fef-a9a5-4e00-998b-aa563e8db69a",
                  "name": "Test Collection",
                  "fork": {
                      "label": "Test Fork",
                      "createdAt": "2022-06-16T19:51:44.069Z",
                      "from": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
                  },
                  "uid": "12345678-09547fef-a9a5-4e00-998b-aa563e8db69a"
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/collections/fork/:collectionId?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"label": "Test Fork"
          }
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "The specified item does not exist.",
                  "details": {
                      "item": "collection",
                      "id": "12ece9e1-2abf-4edc-8e34-de66e74114d2"
                  }
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/collections/fork/:collectionId?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
        - name: collectionId
          value: 12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
      body:
        type: json
        data: |-
          {
          	"label": "Test Fork"
          }
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: Creates a [fork](https://learning.postman.com/docs/collaborating-in-postman/version-control/#creating-a-fork) from an existing collection into a workspace.
