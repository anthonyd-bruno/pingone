info:
  name: Publish documentation
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/collections/:collectionId/public-documentations"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's unique ID.
  body:
    type: json
    data: |-
      {
          "environmentUid": "{{environmentUid}}",
          "customColor": {
              "highlight": "{{colorCode}}",
              "rightSidebar": "{{colorCode}}",
              "topBar": "{{colorCode}}"
          },
          "documentationLayout": "{{documentationLayout}}",
          "customization": {
              "metaTags": [
                  {
                      "name": "title",
                      "value": "{{documentTitle}}"
                  },
                  {
                      "name": "description",
                      "value": "{{documentDescription}}"
                  }
              ],
              "appearance": {
                  "default": "dark",
                  "themes": [
                      {
                          "name": "dark",
                          "colors": {
                              "highlight": "{{colorCode}}",
                              "rightSidebar": "{{colorCode}}",
                              "topBar": "{{colorCode}}"
                          },
                          "logo": "<s3_url>/<cloudfront_url>"
                      },
                      {
                          "name": "light",
                          "colors": {
                              "highlight": "{{colorCode}}",
                              "rightSidebar": "{{colorCode}}",
                              "topBar": "{{colorCode}}"
                          },
                          "logo": "<s3_url>/<cloudfront_url>"
                      }
                  ]
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

