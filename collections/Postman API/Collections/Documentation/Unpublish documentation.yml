info:
  name: Unpublish documentation
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/collections/:collectionId/public-documentations"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's unique ID.
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/collections/:collectionId/public-documentations
      method: DELETE
      params:
        - name: collectionId
          value: 12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2
          type: path
    response:
      statusText: "204"
      body:
        type: text
        data: ""
