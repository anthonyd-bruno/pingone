info:
  name: Update part of a collection
  type: http
  seq: 20

http:
  method: PATCH
  url: "{{baseUrl}}/collections/:collectionId"
  params:
    - name: collectionId
      value: ""
      type: path
      description: The collection's ID.
  body:
    type: json
    data: |-
      {
          "collection": {
              "info": {
                  "name": "Users API",
                  "description": "This is a test."
              },
              "auth": {
                  "type": "apikey",
                  "apikey": [
                      {
                          "key": "value",
                          "value": "{{apiKey}}"
                      },
                      {
                          "key": "key",
                          "value": "api-key"
                      },
                      {
                          "key": "in",
                          "value": "header"
                      }
                  ]
              },
              "events": [
                  {
                      "listen": "prerequest",
                      "script": {
                          "id": "e74ce0d0-5acd-44b6-a3ae-95f617c1546e",
                          "type": "text/javascript",
                          "exec": [
                              ""
                          ]
                      },
                      "disabled": false
                  },
                  {
                      "listen": "test",
                      "script": {
                          "id": "28dc4f71-73bd-49cb-a6bd-8b41a06a3b36",
                          "type": "text/javascript",
                          "exec": [
                              ""
                          ]
                      },
                      "disabled": false
                  }
              ],
              "variable": [
                  {
                      "key": "userId",
                      "value": 12345678,
                      "disabled": true,
                      "description": "The user's ID."
                  }
              ]
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

