info:
  name: Get all groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/groups"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/groups
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": [
                  {
                      "updatedAt": "2024-10-03T14:05:05.000Z",
                      "members": [
                          12345678,
                          87654321,
                          56781234
                      ],
                      "teamId": 1,
                      "id": 123,
                      "name": "API Test Group",
                      "summary": "API testing group.",
                      "roles": [
                          "user"
                      ],
                      "createdAt": "2024-10-03T14:05:05.000Z",
                      "createdBy": 12345678
                  },
                  {
                      "updatedAt": "2024-04-04T13:36:11.000Z",
                      "members": [
                          56789012
                      ],
                      "teamId": 1,
                      "id": 456,
                      "name": "Billing",
                      "summary": "",
                      "roles": [
                          "user"
                      ],
                      "createdAt": "2024-03-06T11:01:42.000Z",
                      "createdBy": 12345678
                  },
                  {
                      "updatedAt": "2024-03-15T19:44:20.000Z",
                      "members": [
                          12345678,
                          87654321,
                          56781234,
                          78906531,
                          45507812
                      ],
                      "teamId": 1,
                      "id": 789,
                      "name": "Collaboration",
                      "summary": "",
                      "roles": [
                          "user"
                      ],
                      "createdAt": "2024-03-15T19:44:20.000Z",
                      "createdBy": 12345678
                  }
              ]
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/groups
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "Unauthorized",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/groups
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/groups
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/internal-server-error",
              "title": "Internal Server Error",
              "detail": "Internal Server Error",
              "status": 500
          }

docs: Gets all of a team's Postman [groups](https://learning.postman.com/docs/collaborating-in-postman/user-groups/).
