info:
  name: Get a monitor
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/monitors/:monitorId"
  params:
    - name: monitorId
      value: ""
      type: path
      description: The monitor's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

