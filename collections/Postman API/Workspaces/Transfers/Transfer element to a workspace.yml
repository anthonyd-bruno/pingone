info:
  name: Transfer element to a workspace
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/workspaces/:workspaceId/element-transfers"
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  body:
    type: json
    data: |-
      {
          "id": "{{elementId}}",
          "type": "{{elementType}}",
          "to": "{{workspaceId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Transfer Collection
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/element-transfers
      method: POST
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
      body:
        type: json
        data: |-
          {
              "id": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
              "type": "collection",
              "to": "d56bc95f-57c5-47cc-bd99-75c4ad96a6dd"
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "workspace": {
                  "element-transfers": {
                      "type": "collection",
                      "from": "ecfa5b91-5de8-43c1-acc0-38d92243754a",
                      "id": "12345678-04c79329-fa51-465a-9bfd-c3107d75f536",
                      "to": "c0084e97-31be-4265-b0d8-25cb0dff5a70"
