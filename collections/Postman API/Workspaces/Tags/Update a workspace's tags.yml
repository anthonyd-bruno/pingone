info:
  name: Update a workspace's tags
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/workspaces/:workspaceId/tags"
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  body:
    type: json
    data: |-
      {
          "tags": [
              {
                  "slug": "{{tagName}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  },
                  {
                      "slug": "test-api"
                  }
              ]
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  },
                  {
                      "slug": "test-api"
                  }
              ]
          }
  - name: Tag Exceeds Max Size
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "oS1Z9gHS9lDaAhX3xu0ekJRZwt0CPIikGYApohSPJVu3n3iiHxdISMqMFVo6wPf8N"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "title": "Bad Request",
              "detail": "body/tags/0/slug must NOT have more than 64 characters",
              "status": 400
          }
  - name: Exceeds Max Number of Tags
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "needs-review"
                  },
                  {
                      "slug": "test-api"
                  },
                  {
                      "slug": "test-collection"
                  },
                  {
                      "slug": "preview"
                  },
                  {
                      "slug": "pre-release"
                  },
                  {
                      "slug": "api-team"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/badrequest",
              "title": "Bad Request",
              "detail": "body/tags must NOT have more than 5 items",
              "status": 400
          }
  - name: Special Character Present
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "test-api!"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "title": "Bad Request",
              "detail": "body/tags/0/slug must match pattern \"^[a-z][a-z0-9-]*[a-z0-9]+$\"",
              "status": 400
          }
  - name: Missing tags Object
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: "{}"
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "statusCode": 400,
              "error": "Bad Request",
              "message": "body must have required property 'tags'"
          }
  - name: Tag Does Not Start with Letter
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/tags
      method: PUT
      params:
        - name: workspaceId
          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: path
      body:
        type: json
        data: |-
          {
              "tags": [
                  {
                      "slug": "1test"
                  }
              ]
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "title": "Bad Request",
              "detail": "body/tags/0/slug must match pattern \"^[a-z][a-z0-9-]*[a-z0-9]+$\"",
              "status": 400
          }
  - name: Unauthorized
