info:
  name: Transfer workspace to a team
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{baseUrl}}/workspaces/:workspaceId/transfers"
  params:
    - name: workspaceId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
          "source": "{{sourceTeamId}}",
          "destination": "{{destinationTeamId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

