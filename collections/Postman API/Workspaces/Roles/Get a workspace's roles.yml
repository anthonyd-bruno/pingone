      url: https://api.getpostman.com/workspaces/:workspaceId/roles
      method: GET
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
      body:
        type: json
        data: |-
          {
              "roles": [
                  {
                      "op": "add",
                      "path": "/user",
                      "value": [
                          {
                              "id": "12345678",
                              "role": 1
                          },
                          {
                              "id": "87654321",
                              "role": 2
                          }
                      ]
                  },
                  {
                      "op": "remove",
                      "path": "/user",
                      "value": [
                          {
                              "id": "87612345",
                              "role": 1
                          }
                      ]
                  },
                  {
                      "op": "add",
                      "path": "/usergroup",
                      "value": [
                          {
                              "id": "123",
                              "role": 2
