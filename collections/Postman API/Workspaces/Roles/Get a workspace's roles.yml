                  {
                      "op": "remove",
                      "path": "/usergroup",
                      "value": [
                          {
                              "id": "312",
                              "role": 3
                          }
                      ]
                  }
              ]
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "Unauthorized",
              "status": 401
