info:
  name: Get a workspace's roles
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/workspaces/:workspaceId/roles"
  params:
    - name: include
      value: scim
      type: query
      description: |-
        Include the following information in the endpoint's response:
        - `scim` — Return IDs as SCIM user and group IDs.
      disabled: true
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/roles
      method: GET
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "roles": [
                  {
                      "id": "1",
                      "displayName": "Viewer",
                      "user": [
                          "12345678"
                      ]
                  },
                  {
                      "id": "3",
                      "displayName": "Admin",
                      "group": [
                          "56781234"
                      ]
                  },
                  {
                      "id": "5",
                      "displayName": "Editor",
                      "partner": [
                          "43215678"
                      ]
                  }
              ]
          }
  - name: Return SCIM IDs
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/roles?include=scim
      method: GET
      params:
        - name: include
          value: scim
          type: query
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "roles": [
                  {
                      "id": "1",
                      "displayName": "Viewer",
                      "user": [
                          "405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99"
                      ]
                  },
                  {
                      "id": "3",
                      "displayName": "Admin",
                      "group": [
                          "561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00"
                      ]
                  },
                  {
                      "id": "5",
                      "displayName": "Editor",
                      "partner": [
                          "43215678"
                      ]
                  }
              ]
          }
