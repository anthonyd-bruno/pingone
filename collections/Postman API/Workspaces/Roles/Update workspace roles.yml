info:
  name: Update workspace roles
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/workspaces/:workspaceId/roles"
  headers:
    - name: identifierType
      value: scim
      description: Use SCIM user IDs instead of Postman user IDs.
      disabled: true
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  body:
    type: json
    data: |-
      {
          "roles": [
              {
                  "op": "{{operationType}}",
                  "path": "{{pathValue}}",
                  "value": [
                      {
                          "id": "{{id}}",
                          "role": "{{workspaceRoleId}}"
                      }
                  ]
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

