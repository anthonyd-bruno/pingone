info:
  name: Get a workspace's activity feed
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/workspaces/:workspaceId/activities"
  params:
    - name: elementType
      value: ""
      type: query
      description: |-
        A comma-separated list of elements to filter the results by:
        - `collection`
        - `workspace`
        - `environment`
        - `mock`
        - `monitor`
      disabled: true
    - name: userId
      value: ""
      type: query
      description: Filter results by the given user ID.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
      disabled: true
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response.
      disabled: true
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

