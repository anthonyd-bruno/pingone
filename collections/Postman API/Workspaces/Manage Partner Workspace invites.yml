info:
  name: Manage Partner Workspace invites
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/invitations"
  body:
    type: json
    data: |-
      {
          "action": "invite_partner",
          "targetEntity": "workspace",
          "targetEntityId": "{{targetEntityId}}",
          "roleId": "{{roleId}}",
          "target": {
              "emails": [
                  "{{userEmailAddress}}"
              ]
          }
      }

      // For examples of removing users, reference the request's examples or the request body schema.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Invite Partners to a Partner Workspace
    request:
      url: https://api.getpostman.com/invitations
      method: POST
      body:
        type: json
        data: |-
          {
              "action": "invite_partner",
              "targetEntity": "workspace",
              "targetEntityId": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
              "roleId": "4",
              "target": {
                  "emails": [
                      "alex.cruz@example.com",
                      "mike.brown@example.com",
                      "sara.smith@example.com"
                  ]
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "targetEntity": "workspace",
              "targetEntityId": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
              "roleId": "4",
              "action": "invite_partner",
              "roleDisplayName": "Viewer",
              "results": [
                  {
                      "status": "PARTNER_ADDED",
                      "userId": 56781234,
                      "message": "Partner added to workspace",
                      "email": "alex.cruz@example.com"
                  },
                  {
                      "status": "ALREADY_INVITED",
                      "email": "mike.brown@xample.com",
                      "invitationLink": "https://go.getpostman.com/invite-signup?invite_code=XXX",
                      "message": "Pending invite exists"
                  },
                  {
                      "status": "EMAIL_SENT",
                      "email": "sara.smith@example.com",
                      "invitationLink": "https://go.getpostman.com/invite-signup?invite_code=XXX"
                  }
              ]
          }
  - name: Partial Invite Success
