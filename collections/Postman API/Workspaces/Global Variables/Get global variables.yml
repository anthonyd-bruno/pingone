info:
  name: Get global variables
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/workspaces/:workspaceId/global-variables"
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/global-variables
      method: GET
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "values": [
                  {
                      "value": "{{postman-api-key}}",
                      "key": "x-api-key",
                      "enabled": true,
                      "type": "secret",
                      "description": "A valid Postman API key."
                  },
                  {
                      "value": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                      "key": "collectionId",
                      "enabled": true,
                      "type": "default",
                      "description": "The collection's ID."
                  }
              ]
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/workspaces/:workspaceId/global-variables
      method: GET
      params:
        - name: workspaceId
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: path
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/servererror",
              "title": "Internal server error",
              "detail": "Details about the error"
          }

docs: Gets a workspace's global [variables](https://learning.postman.com/docs/sending-requests/variables/#variable-scopes). Global variables enable you to access data between collections, requests, scripts, and environments and are available throughout a workspace.
