info:
  name: Update global variables
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/workspaces/:workspaceId/global-variables"
  params:
    - name: workspaceId
      value: ""
      type: path
      description: The workspace's ID.
  body:
    type: json
    data: |-
      {
          "values": [
              {
                  "key": "{{keyName}}",
                  "type": "{{keyType}}",
                  "value": "{{keyValue}}",
                  "enabled": true,
                  "description": "{{variableDescription}}"
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/workspaces/1f0df51a-8658-4ee8-a2a1-d2567dfa09a9/global-variables
      method: PUT
      body:
        type: json
        data: |-
          {
            "values": [
              {
                "key": "x-api-key",
                "value": "{{postman-api-key}}",
                "type": "secret",
                "enabled": true,
                "description": "A valid Postman API key."
              },
              {
                "key": "collectionId",
                "value": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                "type": "default",
                "enabled": true,
                "description": "The collection's ID."
              }
            ]
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "values": [
                  {
                      "value": "{{postman-api-key}}",
                      "key": "x-api-key",
                      "enabled": true,
                      "type": "secret",
                      "description": "A valid Postman API key."
                  },
                  {
                      "value": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                      "key": "collectionId",
                      "enabled": true,
                      "type": "default",
                      "description": "The collection's ID."
                  }
              ]
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/workspaces/1f0df51a-8658-4ee8-a2a1-d2567dfa09a9/global-variables
      method: PUT
      body:
        type: json
        data: |-
          {
            "values": [
              {
                "key": "api-key",
                "type": "secret",
                "value": "PMAK-XXXX",
                "enabled": true
              },
              {
                "key": "collection_uid",
                "type": "default",
                "value": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                "enabled": true
              }
            ]
          }
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/servererror",
              "title": "Internal server error",
              "detail": "Details about the error"
          }

docs: Updates and replaces a workspace's global [variables](https://learning.postman.com/docs/sending-requests/variables/#variable-scopes). This endpoint replaces all existing global variables with the variables you pass in the request body.
