info:
  name: Get elements by tag
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/tags/:slugId/entities"
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of tagged elements to return in a single call.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: The ascending (`asc`) or descending (`desc`) order to sort the results by, based on the time of the element's tagging.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: |-
        The cursor to get the next set of results in the paginated response. Use the `nextCursor` value in the response's `meta` object for this value.

        If you pass an invalid value, the API only returns the first set of results.
      disabled: true
    - name: entityType
      value: ""
      type: query
      description: |-
        Filter results for the given element type:
        - `collection`
        - `workspace`
      disabled: true
    - name: slugId
      value: ""
      type: path
      description: The tag's ID within a team or individual (non-team) user scope. For example, "needs-review".
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "data": {
                  "entities": [
                      {
                          "entityId": "8b86dfe8-de72-44e6-81ea-79d19805bc6a",
                          "entityType": "collection"
                      }
                  ]
              },
              "meta": {
                  "count": 1
              }
          }
  - name: Successful Response With Next Cursor
    request:
      url: https://api.getpostman.com/tags/:slugId/entities?cursor=eyJpZCI6ODYsImVudGl0eVR5cGUiOiJhcGkifQ==
      method: GET
      params:
        - name: cursor
          value: eyJpZCI6ODYsImVudGl0eVR5cGUiOiJhcGkifQ==
          type: query
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
            "data": {
              "entities": [
                {
                  "entityId": "12345678-6fd634a3-79ba-451d-8f07-56a953f96667",
                  "entityType": "collection"
                },
                {
                  "entityId": "7a95cfe8-de72-44e6-81ea-79d19805bd7b",
                  "entityType": "workspace"
                }
              ]
            },
            "meta": {
              "count": 2,
              "nextCursor": "eyJpZCI6ODYsImVudGl0eVR5cGUiOiJhcGkifQ=="
            }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: 23894fhsjrs
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": "Bad Request",
              "message": "params/slug must match pattern \"^[a-z][a-z0-9-]*[a-z0-9]+$\"",
              "statusCode": 400
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/unauthorized",
              "title": "Unauthorized",
              "detail": "The request lacks valid credentials.",
              "status": 401
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Access Denied",
              "detail": "You do not have developer role. Ask your (super)admin to grant you developer role",
              "status": 403
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/not-found",
              "title": "Resource Not Found",
              "detail": "Slug 'needs-review' does not exist",
              "status": 404,
              "instance": "/slugs/needs-review/entities"
          }
  - name: Unexpected Error
    request:
      url: https://api.getpostman.com/tags/:slugId/entities
      method: GET
      params:
        - name: slugId
          value: needs-review
          type: path
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/internal-server-error",
              "title": "Something went wrong",
              "detail": "Something went wrong while fetching entities having the provided slug",
              "status": 500,
              "instance": "/tags/hello-world/entities"
          }

docs: |-
  Gets Postman elements (entities) by a given tag. Tags enable you to organize and search [workspaces ](https://learning.postman.com/docs/collaborating-in-postman/using-workspaces/managing-workspaces/#tagging-a-workspace) and [collections](https://learning.postman.com/docs/collections/using-collections/#tagging-a-collection) that contain shared tags.

  **Note:**

  Tagging is available on [Postman Enterprise plans](https://www.postman.com/pricing/).
