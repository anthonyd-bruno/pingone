info:
  name: Import an OpenAPI definition
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/import/openapi?workspace="
  params:
    - name: workspace
      value: ""
      type: query
      description: |-
        The workspace ID in which to import the OpenAPI specification.

        If you do not include this parameter, the system imports the definition into the oldest personal Internal workspace you own.
  body:
    type: json
    data: |-
      {
          "type": "{{APIspecificationType}}",
          "input": "{{APIspecification}}",
          "options": {
              "{{optionName}}": "{{optionvalue}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/import/openapi
      method: POST
      body:
        type: json
        data: |-
          {
              "type": "json",
              "input": {
                  "openapi": "3.0.0",
                  "servers": [
                      {
                          "url": "example.com"
                      }
                  ],
                  "info": {
                      "contact": {
                          "name": "Jon"
                      },
                      "version": "1.0.0",
                      "title": "Sample API",
                      "description": "Buy or rent spacecrafts"
                  },
                  "paths": {
                      "/spacecrafts/{spacecraftId}": {
                          "parameters": [
                              {
                                  "name": "spacecraftId",
                                  "description": "The unique identifier of the spacecraft",
                                  "in": "path",
                                  "required": true,
                                  "schema": {
                                      "$ref": "#/components/schemas/SpacecraftId"
                                  }
                              }
                          ],
                          "get": {
                              "summary": "Read a spacecraft",
                              "responses": {
                                  "200": {
                                      "description": "The spacecraft corresponding to the provided `spacecraftId`",
                                      "content": {
                                          "application/json": {
                                              "schema": {
                                                  "$ref": "#/components/schemas/Spacecraft"
                                              }
                                          }
                                      }
                                  },
                                  "404": {
                                      "description": "No spacecraft found for the provided `spacecraftId`",
                                      "content": {
                                          "application/json": {
                                              "schema": {
                                                  "$ref": "#/components/schemas/Error"
                                              }
                                          }
                                      }
                                  },
                                  "500": {
                                      "description": "Unexpected error",
                                      "content": {
                                          "application/json": {
                                              "schema": {
                                                  "$ref": "#/components/schemas/Error"
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  },
                  "components": {
                      "schemas": {
                          "SpacecraftId": {
                              "description": "The unique identifier of a spacecraft",
                              "type": "string"
                          },
                          "Spacecraft": {
                              "type": "object",
                              "required": [
                                  "id",
                                  "name",
                                  "type"
                              ],
                              "properties": {
                                  "id": {
                                      "$ref": "#/components/schemas/SpacecraftId"
                                  },
                                  "name": {
                                      "type": "string"
                                  },
                                  "type": {
                                      "type": "string",
                                      "enum": [
                                          "capsule",
                                          "probe",
                                          "satellite",
                                          "spaceplane",
                                          "station"
                                      ]
                                  },
                                  "description": {
                                      "type": "string"
                                  }
                              }
                          },
                          "Error": {
                              "type": "object",
                              "required": [
                                  "message"
                              ],
                              "properties": {
                                  "message": {
                                      "description": "A human readable error message",
                                      "type": "string"
                                  }
                              }
                          }
                      },
                      "securitySchemes": {
                          "ApiKey": {
                              "type": "apiKey",
                              "in": "header",
                              "name": "X-Api-Key"
                          }
                      }
                  },
                  "security": [
                      {
                          "ApiKey": []
                      }
                  ]
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "collections": [
                  {
                      "id": "12ece9e1-2abf-4edc-8e34-de66e74114d2",
                      "name": "Sample API",
                      "uid": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
                  }
              ]
          }
