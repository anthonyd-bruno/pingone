info:
  name: Create a webhook
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/webhooks?workspace="
  params:
    - name: workspace
      value: ""
      type: query
      description: |-
        A workspace ID in which to create the webhook.

        If you do not include this parameter, the system creates the webhook in the oldest personal Internal workspace you own.
  body:
    type: json
    data: |-
      {
          "webhook":{
              "name": "{{webhookName}}",
              "collection": "{{collectionUid}}",
              "environment": "{{environmentUid}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/webhooks?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
      body:
        type: json
        data: |-
          {
              "webhook":{
                  "name": "Test Webhook",
                  "collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "webhook": {
                  "id": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
                  "name": "Test Webhook",
                  "collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                  "webhookUrl": "https://newman-api.getpostman.com/run/12345678/267a6e99-b6da-407c-a96f-03be2d6282fb",
                  "uid": "12345678-1f0df51a-8658-4ee8-a2a1-d2567dfa09a9"
              }
          }
  - name: Missing Parameter
    request:
      url: https://api.getpostman.com/webhooks?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
      body:
        type: json
        data: |-
          {
              "webhook":{
                  "name": "Test Webhook"
              }
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "paramMissingError",
                  "message": "Parameter is missing in the request.",
                  "details": {
                      "param": [
                          "collection"
                      ]
                  }
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/webhooks?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
      body:
        type: json
        data: |-
          {
              "webhook":{
                  "name": "Test Webhook",
                  "collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2"
              }
          }
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: |-
  Creates a webhook that triggers a collection with a custom payload. You can get the webhook's URL from the `webhookUrl` property in the endpoint's response.

  **Note:**

  If you do not include the `workspace` query parameter, the system creates the webhook in the oldest personal Internal workspace you own.
