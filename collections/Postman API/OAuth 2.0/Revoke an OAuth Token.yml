info:
  name: Revoke an OAuth Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/oauth2/token/revoke"
  body:
    type: json
    data: |-
      {
          "token": "{{accessToken}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Token Revoked
    request:
      url: https://api.getpostman.com/oauth2/token/revoke
      method: POST
      body:
        type: json
        data: |-
          {
              "token": "PMAK-68e8XXX"
          }
    response:
      statusText: "200"
      headers:
        - name: Date
          value: Fri, 10 Oct 2025 06:08:31 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "2"
        - name: Connection
          value: keep-alive
        - name: ETag
          value: W/"2-vyGp6PvFo4RvsFtPoIWeCReyIC8"
        - name: Vary
          value: Accept-Encoding
      body:
        type: json
        data: |-
          {
              "success": "true"
          }
  - name: Token Not Found
    request:
      url: https://api.getpostman.com/oauth2/token/revoke
      method: POST
      body:
        type: json
        data: |-
          {
              "token": "PMAK-68e8XXX"
          }
    response:
      statusText: "404"
      headers:
        - name: Date
          value: Fri, 10 Oct 2025 06:08:31 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "2"
        - name: Connection
          value: keep-alive
        - name: ETag
          value: W/"2-vyGp6PvFo4RvsFtPoIWeCReyIC8"
        - name: Vary
          value: Accept-Encoding
      body:
        type: json
        data: |-
          {
              "error": "invalid_client",
              "error_description": "Token not found"
          }

docs: |-
  Revokes an active OAuth 2.0 access token and prevents further use of it for authentication. Once revoked, the token can't be used for any API requests.

  **Note:**

  Revocation of an OAuth token is immediate and can't be undone.
