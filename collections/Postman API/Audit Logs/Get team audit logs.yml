  - name: Invalid Audit Action
    request:
      url: https://api.getpostman.com/audit/logs?action=Created API Key
      method: GET
      params:
        - name: action
          value: Created API Key
          type: query
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "InvalidAuditAction",
                  "message": "Invalid audit action format. Expected format: prefix.action_name (e.g., user.login)."
              }
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/audit/logs
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "AuthenticationError",
                  "message": "Invalid API Key. Every request requires a valid API Key to be sent."
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/audit/logs
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "ForbiddenRequest",
                  "message": "You do not have permissions to view team Audit logs"
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/audit/logs
      method: GET
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: Gets a list of your team's generated audit events. For a complete list of all audit events, see [Audit logs](https://learning.postman.com/docs/administration/audit-logs/).
