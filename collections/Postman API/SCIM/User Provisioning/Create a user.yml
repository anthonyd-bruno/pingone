info:
  name: Create a user
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/scim/v2/Users"
  body:
    type: json
    data: |-
      {
          "schemas": [
              "urn:ietf:params:scim:schemas:core:2.0:User"
          ],
          "userName": "{{userEmail}}",
          "name": {
              "givenName": "{{firstName}}",
              "familyName": "{{lastName}}"
          },
          "externalId": "{{externalUserId}}",
          "locale": "{{locale}}",
          "groups": [
              "{{groupId}}"
          ],
          "active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

