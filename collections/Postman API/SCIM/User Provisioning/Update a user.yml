info:
  name: Update a user
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/scim/v2/Users/:userId"
  params:
    - name: userId
      value: ""
      type: path
      description: The user's SCIM ID.
  body:
    type: json
    data: |-
      {
          "schemas": [
              "urn:ietf:params:scim:schemas:core:2.0:User"
              ],
          "userName": "{{userEmail}}",
          "name": {
              "givenName": "{{firstName}}",
              "familyName": "{{lastName}}"
          },
          "active": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

