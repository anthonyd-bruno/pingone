          }
  - name: Filter Inactive Users
    request:
      url: https://api.getpostman.com/scim/v2/Users?filter=active eq "false"
      method: GET
      params:
        - name: filter
          value: active eq "false"
          type: query
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 1,
              "startIndex": 1,
              "itemsPerPage": 1,
              "Resources": [
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:User"
                      ],
                      "id": "123775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99",
                      "userName": "alex.cruz@example.com",
