info:
  name: Get all users
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/scim/v2/Users"
  params:
    - name: startIndex
      value: "1"
      type: query
      description: The index entry by which to begin the list of returned results. Must be a value of `1` or greater.
      disabled: true
    - name: filter
      value: ""
      type: query
      description: |-
        Filter results by a specific word or phrase. This query parameter accepts the following:
        - `userName` — Filter values are case-sensitive, and special characters and spaces must be URL encoded.
        - `active` — Return only users who are active (`true`) or inactive (`false`).
      disabled: true
    - name: count
      value: ""
      type: query
      description: Limit the number of results returned in a single response. By default, the system returns a list of 100 users.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/scim/v2/Users?startIndex=1&count=50
      method: GET
      params:
        - name: startIndex
          value: "1"
          type: query
        - name: count
          value: "50"
          type: query
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 2,
              "startIndex": 1,
              "itemsPerPage": 2,
              "Resources": [
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:User"
                      ],
                      "id": "405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99",
                      "userName": "taylor-lee@example.com",
                      "name": {
                          "givenName": "Taylor",
                          "familyName": "Lee"
                      },
                      "externalId": "12345678",
                      "active": true,
                      "meta": {
                          "resourceType": "User",
                          "created": "2021-02-22T04:24:13.000Z",
                          "lastModified": "2021-02-22T04:24:13.000Z"
                      }
                  },
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:User"
                      ],
                      "id": "123775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99",
