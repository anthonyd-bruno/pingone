                      "active": false,
                      "meta": {
                          "resourceType": "User",
                          "created": "2021-02-22T04:24:13.000Z",
                          "lastModified": "2021-02-22T04:24:13.000Z"
                      }
                  }
              ]
          }
  - name: No Results Found
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 0,
              "startIndex": 1,
              "itemsPerPage": 0,
              "Resources": []
          }
  - name: Filter Results
    request:
      url: https://api.getpostman.com/scim/v2/Users?filter=userName eq "taylor%2Dlee@example.com"
      method: GET
      params:
        - name: filter
          value: userName eq "taylor%2Dlee@example.com"
          type: query
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 1,
              "startIndex": 1,
              "itemsPerPage": 1,
              "Resources": [
                  {
