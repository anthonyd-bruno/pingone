          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 0,
              "startIndex": 1,
              "itemsPerPage": 0,
              "Resources": []
          }
  - name: Invalid Filter
    request:
      url: https://api.getpostman.com/scim/v2/Users?filter=userName ne "taylor%2Dlee@example.com"
      method: GET
      params:
        - name: filter
          value: userName ne "taylor%2Dlee@example.com"
          type: query
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "You’ve used filter(s) that Postman doesn’t support.",
              "status": "400"
          }
  - name: Invalid Team
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This Postman team doesn’t exist anymore.",
              "status": "400"
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/scim/v2/Users?startIndex=1&count=50
      method: GET
      params:
        - name: startIndex
          value: "1"
          type: query
        - name: count
          value: "50"
          type: query
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This Postman team doesn’t exist anymore.",
              "status": "400"
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to access the team. Check if you have entered a valid API key.",
              "status": "401"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "403"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Your API key was generated by a Team Admin who is no longer on your team. Use an API key generated by a Team Admin.",
              "status": "403"
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "429"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "That’s 300 attempts in less than a minute. Wait for a minute and then try again.",
              "status": 429
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/scim/v2/Users
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Couldn’t fetch members of the team.",
              "status": "500"
          }

docs: Gets information about all Postman team members.
