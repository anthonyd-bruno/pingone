http:
  method: PATCH
  url: "{{baseUrl}}/scim/v2/Users/:userId"
  params:
    - name: userId
      value: ""
      type: path
      description: The user's SCIM ID.
  body:
    type: json
    data: |-
      {
          "schemas": [
              "urn:ietf:params:scim:api:messages:2.0:PatchOp"
          ],
          "Operations": [
              {
                  "op": "replace",
                  "value": {
                      "active": true
                  }
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

