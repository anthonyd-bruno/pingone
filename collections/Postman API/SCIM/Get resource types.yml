info:
  name: Get resource types
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/scim/v2/ResourceTypes"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/scim/v2/ResourceTypes
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          [
              {
                  "schemas": [
                      "urn:ietf:params:scim:schemas:core:2.0:ResourceType"
                  ],
                  "id": "User",
                  "name": "User",
                  "endpoint": "/Users",
                  "description": "User Account",
                  "schema": "urn:ietf:params:scim:schemas:core:2.0:User",
                  "schemaExtensions": [
                      {
                          "schema": "urn:ietf:params:scim:schemas:extension:enterprise:2.0:User",
                          "required": true
                      }
                  ]
              },
              {
                  "schemas": [
                      "urn:ietf:params:scim:schemas:core:2.0:ResourceType"
                  ],
                  "id": "Group",
                  "name": "Group",
                  "endpoint": "/Groups",
                  "description": "Group Account",
                  "schema": "urn:ietf:params:scim:schemas:core:2.0:Group"
              }
          ]

docs: Gets all the resource types supported by Postman's SCIM API.
