info:
  name: Get a group
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/scim/v2/Groups/:groupId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:schemas:core:2.0:Group"
              ],
              "id": "561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00",
              "displayName": "TestAPI",
              "members": [
                  {
                      "value": "b1c794f24f4c49f4b5d503a4cb2686ea",
                      "display": "Taylor Lee"
                  }
              ],
              "externalId": "1234",
              "meta": {
                  "resourceType": "Group",
                  "created": "2022-02-22T04:24:13.000Z",
                  "lastModified": "2022-02-22T04:24:13.000Z"
              }
          }
  - name: Invalid Team
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This Postman team doesn’t exist anymore.",
              "status": "400"
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to access the team. Check if you have entered a valid API key.",
              "status": "401"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Your API key was generated by a Team Admin who is no longer on your team. Use an API key generated by a Team Admin.",
              "status": "403"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This group isn’t a member of the team.",
              "status": "404"
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "429"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "That’s 300 attempts in less than a minute. Wait for a minute and then try again.",
              "status": 429
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: GET
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to fetch information about this team member.",
              "status": "500"
          }

docs: Gets information about a Postman group within the team.
