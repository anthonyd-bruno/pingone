    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: POST
      body:
        type: json
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:schemas:core:2.0:Group"
              ],
              "displayName": "TestAPI",
              "members": []
          }
    response:
      statusText: "201"
