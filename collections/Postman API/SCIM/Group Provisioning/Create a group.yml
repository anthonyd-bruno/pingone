info:
  name: Create a group
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/scim/v2/Groups"
  body:
    type: json
    data: |-
      {
          "schemas": ["urn:ietf:params:scim:schemas:core:2.0:Group"],
          "displayName": "{{userGroup}}",
          "members": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

