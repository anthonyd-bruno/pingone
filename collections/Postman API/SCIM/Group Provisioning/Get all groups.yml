info:
  name: Get all groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/scim/v2/Groups"
  params:
    - name: startIndex
      value: "1"
      type: query
      description: The index entry by which to begin the list of returned results. Must be a value of `1` or greater.
      disabled: true
    - name: count
      value: "100"
      type: query
      description: Limit the number of results returned in a single response. By default, the system returns a list of 100 users.
      disabled: true
    - name: filter
      value: ""
      type: query
      description: |-
        Filter results by a specific word or phrase. This query parameter only supports the `displayName` filter and has the following requirements:
        - Filter values are case-sensitive.
        - Special characters and spaces must be URL encoded.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 2,
              "startIndex": 1,
              "itemsPerPage": 2,
              "Resources": [
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:Group"
                      ],
                      "id": "561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00",
                      "displayName": "TestAPI",
                      "members": [
                          {
                              "value": "23a35c2723d34c03b4c56443c09e7173",
                              "display": "Taylor Lee"
                          }
                      ],
                      "externalId": "1234",
                      "meta": {
                          "resourceType": "Group",
                          "created": "2022-02-22T04:24:13.000Z",
                          "lastModified": "2022-02-22T04:24:13.000Z"
                      }
                  },
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:Group"
                      ],
                      "id": "123775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99",
                      "displayName": "Test Group",
                      "members": [
                          {
                              "value": "23a35c2723d34c03b4c56443c09e7173",
                              "display": "Taylor Lee"
                          },
                          {
                              "value": "ghc794f24f4c49f4b5d503a4cb2686e90",
                              "display": "Alex Cruz"
                          }
                      ],
                      "externalId": "4321",
                      "meta": {
                          "resourceType": "Group",
                          "created": "2022-02-22T04:24:13.000Z",
                          "lastModified": "2022-02-22T04:24:13.000Z"
                      }
                  }
              ]
          }
  - name: Filter Results
    request:
      url: https://api.getpostman.com/scim/v2/Groups?filter=displayName eq "TestAPI"
      method: GET
      params:
        - name: filter
          value: displayName eq "TestAPI"
          type: query
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 1,
              "startIndex": 1,
              "itemsPerPage": 1,
              "Resources": [
                  {
                      "schemas": [
                          "urn:ietf:params:scim:schemas:core:2.0:Group"
                      ],
                      "id": "561631fq14ed41872a8eea4c8aa2b38cda9749812cc55c00",
                      "displayName": "TestAPI",
                      "members": [
                          {
                              "value": "b1c794f24f4c49f4b5d503a4cb2686ea",
                              "display": "Taylor Lee"
                          }
                      ],
                      "externalId": "1234",
                      "meta": {
                          "resourceType": "Group",
                          "created": "2022-02-22T04:24:13.000Z",
                          "lastModified": "2022-02-22T04:24:13.000Z"
                      }
                  }
              ]
          }
  - name: No Results Found
    request:
      url: https://api.getpostman.com/scim/v2/Groups?startIndex=1&count=2
      method: GET
      params:
        - name: startIndex
          value: "1"
          type: query
        - name: count
          value: "2"
          type: query
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:ListResponse"
              ],
              "totalResults": 0,
              "startIndex": 1,
              "itemsPerPage": 0,
              "Resources": []
          }
  - name: Invalid Team
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This Postman team doesn’t exist anymore.",
              "status": "400"
          }
  - name: Invalid Filter
    request:
      url: https://api.getpostman.com/scim/v2/Groups?startIndex=1&count=2&filter=displayName ne "TestAPI"
      method: GET
      params:
        - name: startIndex
          value: "1"
          type: query
        - name: count
          value: "2"
          type: query
        - name: filter
          value: displayName ne "TestAPI"
          type: query
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "You’ve used filter(s) that Postman doesn’t support.",
              "status": "400"
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to access the team. Check if you have entered a valid API key.",
              "status": "401"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Your API key was generated by a Team Admin who is no longer on your team. Use an API key generated by a Team Admin.",
              "status": "403"
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "429"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "That’s 300 attempts in less than a minute. Wait for a minute and then try again.",
              "status": 429
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/scim/v2/Groups
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Couldn’t fetch members of the team.",
              "status": "500"
          }

docs: Gets all Postman groups within the team.
