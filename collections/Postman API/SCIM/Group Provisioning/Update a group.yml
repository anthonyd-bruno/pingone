info:
  name: Update a group
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/scim/v2/Groups/:groupId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group's ID.
  body:
    type: json
    data: |-
      {
          "schemas": [
              "urn:ietf:params:scim:api:messages:2.0:PutOp"
          ],
          "Operations": [
              {
                  "op": "{{operation}}",
                  "value": {
                      "id": "{{groupId}}",
                      "displayName": "{{userGroupName}}"
                  }
              }
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

