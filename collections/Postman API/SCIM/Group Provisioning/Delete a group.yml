info:
  name: Delete a group
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/scim/v2/Groups/:groupId"
  params:
    - name: groupId
      value: ""
      type: path
      description: The group's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Group Deleted
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "204"
      body:
        type: text
        data: ""
  - name: Bad Request
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This Postman team doesn’t exist anymore.",
              "status": "400"
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to access the team. Check if you have entered a valid API key.",
              "status": "401"
          }
  - name: Invalid API Key
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Your API key was generated by a Team Admin who is no longer on your team. Use an API key generated by a Team Admin.",
              "status": "403"
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "This group isn’t a member of the team.",
              "status": "404"
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "429"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "That’s 300 attempts in less than a minute. Wait for a minute and then try again.",
              "status": 429
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/scim/v2/Groups/:groupId
      method: DELETE
      params:
        - name: groupId
          value: 405775fe15ed41872a8eea4c8aa2b38cda9749812cc55c99
          type: path
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "schemas": [
                  "urn:ietf:params:scim:api:messages:2.0:Error"
              ],
              "detail": "Unable to fetch information about this team member.",
              "status": "500"
          }

docs: |-
  Deletes a group in Postman. On success, this returns an HTTP `204 No Content` response.

  User accounts that were in the deleted group are deactivated in Postman if the app is assigned to the user only with the deleted group.

  User accounts and the data corresponding to them are **not** deleted. To permanently delete user accounts and their data, [contact Postman support](https://www.postman.com/support/).
