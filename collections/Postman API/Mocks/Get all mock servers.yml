info:
  name: Get all mock servers
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/mocks"
  params:
    - name: teamId
      value: ""
      type: query
      description: Return only mock servers that belong the given team ID.
      disabled: true
    - name: workspace
      value: ""
      type: query
      description: Return only mock servers in the given workspace.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

