info:
  name: Get a server response
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/mocks/:mockId/server-responses/:serverResponseId"
  params:
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
    - name: serverResponseId
      value: ""
      type: path
      description: The server response's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "createdAt": "2022-08-02T15:08:03.000Z",
              "updatedAt": "2022-08-02T15:08:03.000Z",
              "id": "965cdd16-fe22-4d96-a161-3d05490ac421",
              "name": "Internal Server Error",
              "statusCode": 500,
              "headers": [],
              "language": null,
              "body": "{\n    \"message\": \"Something went wrong; try again later.\"\n}",
              "createdBy": "20891195",
              "updatedBy": "20891195",
              "mock": "32cd624d-9986-4f20-9048-89252f722269"
          }
  - name: Server Response Not Found
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "serverResponseNotFoundError",
                  "header": "Unable to find mock server response",
                  "message": "We could not find the mock server response you are looking for."
              }
          }
  - name: Mock Server Not Found
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "mockNotFoundError",
                  "header": "Unable to find mock",
                  "message": "Please refresh and try again."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }

docs: Gets information about a server response.
