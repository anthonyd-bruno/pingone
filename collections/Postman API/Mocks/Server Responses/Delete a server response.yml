info:
  name: Delete a server response
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/mocks/:mockId/server-responses/:serverResponseId"
  params:
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
    - name: serverResponseId
      value: ""
      type: path
      description: The server response's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/mocks/12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289/server-responses/965cdd16-fe22-4d96-a161-3d05490ac421
      method: DELETE
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "id": "bf6bbf95-bebb-44ba-8edb-1f096f905774",
              "name": "Service Unavailable",
              "statusCode": 503,
              "headers": [
                  {
                      "key": "Content-Type",
                      "value": "application/json"
                  }
              ],
              "language": "json",
              "body": "{\n    \"message\": \"Service is temporarily unavailable due to maintenance. If the problem persists, reach out to support.\"\n}",
              "createdBy": "12345678",
              "updatedBy": "12345678",
              "createdAt": "2022-05-02T09:38:04.000Z"
          }
  - name: Server Response Not Found
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: DELETE
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "serverResponseNotFoundError",
                  "header": "Unable to find mock server response",
                  "message": "We could not find the mock server response you are looking for."
              }
          }
  - name: Mock Server Not Found
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: DELETE
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "mockNotFoundError",
                  "header": "Unable to find mock",
                  "message": "Please refresh and try again."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
