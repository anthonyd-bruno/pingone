info:
  name: Update a server response
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/mocks/:mockId/server-responses/:serverResponseId"
  params:
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
    - name: serverResponseId
      value: ""
      type: path
      description: The server response's ID.
  body:
    type: json
    data: |-
      {
          "serverResponse": {
              "name": "{{serverStubName}}",
              "statusCode": 500,
              "headers": [
                  {
                      "key": "{{headerKey}}",
                      "value": "{{headerValue}}"
                  }
              ],
              "body": "{{serverStubBody}}",
              "language": "{{languageType}}"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/mocks/:mockId/server-responses/:serverResponseId
      method: PUT
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
        - name: serverResponseId
          value: 965cdd16-fe22-4d96-a161-3d05490ac421
          type: path
      body:
        type: json
        data: |-
          {
              "serverResponse": {
                  "name": "Service Unavailable",
                  "statusCode": 503,
                  "headers": [
                      {
                          "key": "Content-type",
                          "value": "application/json"
                      }
                  ],
                  "language": "json",
                  "body": "{\n    \"message\": \"Service is temporarily unavailable due to maintenance. Please reach out to support if the problem persists.\"\n}"
              }
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "createdAt": "2022-08-02T15:08:03.000Z",
              "updatedAt": "2022-08-02T15:58:12.000Z",
              "id": "965cdd16-fe22-4d96-a161-3d05490ac421",
              "name": "Service Unavailable",
              "statusCode": 503,
              "headers": [
                  {
                      "key": "Content-type",
                      "value": "application/json"
                  }
              ],
              "language": "json",
              "body": "{\n    \"message\": \"Service is temporarily unavailable due to maintenance. Please reach out to support if the problem persists.\"\n}",
              "createdBy": "12345678",
              "updatedBy": "12345678",
              "mock": "e3d951bf-873f-49ac-a658-b2dcb91d3289"
          }
  - name: Bad Request
