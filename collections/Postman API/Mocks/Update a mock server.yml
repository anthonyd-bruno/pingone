info:
  name: Update a mock server
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/mocks/:mockId"
  params:
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
  body:
    type: json
    data: |-
      {
          "mock": {
              "name": "{{mockName}}",
              "environment": "{{environmentUid}}",
              "private": true,
              "versionTag": "{{apiVersionTagId}}",
              "collection": "{{collectionId}}",
              "config": {
                  "serverResponseId": "{{serverResponseId}}"
              }
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
