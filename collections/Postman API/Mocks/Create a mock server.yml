info:
  name: Create a mock server
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/mocks?workspace="
  params:
    - name: workspace
      value: ""
      type: query
      description: |-
        A workspace ID in which to create the mock server.

        If you do not include this query parameter, the system creates the mock server in the oldest personal Internal workspace you own.
  body:
    type: json
    data: |-
      {
      	"mock": {
              "name": "{{mockName}}",
      		"collection": "{{collectionId}}",
      		"environment": "{{environmentId}}",
              "private": true
      	}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/mocks?workspace=1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
      method: POST
      params:
        - name: workspace
          value: 1f0df51a-8658-4ee8-a2a1-d2567dfa09a9
          type: query
      body:
        type: json
        data: |-
          {
          	"mock": {
                  "name": "Test Mock",
          		"collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
          		"environment": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e",
                  "private": false
          	}
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "mock": {
                  "id": "e3d951bf-873f-49ac-a658-b2dcb91d3289",
                  "owner": "12345678",
                  "uid": "12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289",
                  "collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                  "mockUrl": "https://e3d951bf-873f-49ac-a658-b2dcb91d3289.mock.pstmn.io",
                  "name": "Test Mock",
                  "config": {
                      "headers": [],
                      "matchBody": false,
                      "matchQueryParams": true,
                      "matchWildcards": true,
                      "delay": null,
                      "serverResponseId": null
                  },
                  "createdAt": "2022-06-09T19:00:39.000Z",
                  "updatedAt": "2022-06-09T19:00:39.000Z",
                  "environment": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e"
              }
          }
  - name: Bad Request
    request:
      url: https://api.getpostman.com/mocks
      method: POST
      body:
        type: json
        data: |-
          {
          	"mock": {
          		"environment": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e",
                  "name": "Test Mock"
          	}
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "paramMissingError",
                  "message": "Parameter is missing in the request.",
                  "details": {
                      "param": [
                          "collection"
                      ]
                  }
              }
          }
  - name: Collection API Error
    request:
      url: https://api.getpostman.com/mocks
      method: POST
      body:
        type: json
        data: |-
          {
          	"mock": {
                  "name": "Test Mock",
          		"collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
          		"environment": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e",
                  "private": false
          	}
          }
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "workspaceError",
                  "message": "Can't create mock servers on a collection added to an API"
              }
          }
  - name: Rate Limit Exceeded
    request:
