info:
  name: Get a mock server's call logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/mocks/:mockId/call-logs"
  params:
    - name: limit
      value: ""
      type: query
      description: The maximum number of rows to return in the response. This value defaults to 100.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: The pointer to the first record of the set of paginated results. To view the next response, use the `nextCursor` value for this parameter.
      disabled: true
    - name: until
      value: ""
      type: query
      description: Return only results created until this given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be earlier than the `since` value.
      disabled: true
    - name: since
      value: ""
      type: query
      description: Return only results created since the given time, in [ISO 8601](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) format. This value cannot be later than the `until` value.
      disabled: true
    - name: responseStatusCode
      value: ""
      type: query
      description: Return only call logs that match the given HTTP response status code.
      disabled: true
    - name: responseType
      value: ""
      type: query
      description: Return only call logs that match the given response type. Matching is not case-sensitive.
      disabled: true
    - name: requestMethod
      value: ""
      type: query
      description: Return only call logs that match the given HTTP method. Matching is not case-sensitive.
      disabled: true
    - name: requestPath
      value: ""
      type: query
      description: Return only call logs that match the given request path. Matching is not case-sensitive.
      disabled: true
    - name: sort
      value: ""
      type: query
      description: |-
        Sort the results by the given value. If you use this query parameter, you must also use the `direction` parameter.

        If you use this query parameter, you must also use the `direction` parameter.
      disabled: true
    - name: direction
      value: ""
      type: query
      description: |-
        Sort in ascending (`asc`) or descending (`desc`) order. Matching is not case-sensitive.

        If you use this query parameter, you must also use the `sort` parameter.
      disabled: true
    - name: include
      value: ""
      type: query
      description: |-
        Include call log records with header and body data. This query parameter accepts the `request.headers`, `request.body`, `response.headers`, and `response.body` values.

        For multiple include types, comma-separate each value.
      disabled: true
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
  auth: inherit

