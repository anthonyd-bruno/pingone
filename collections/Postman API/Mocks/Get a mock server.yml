info:
  name: Get a mock server
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/mocks/:mockId"
  params:
    - name: mockId
      value: ""
      type: path
      description: The mock's ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/mocks/:mockId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "mock": {
                  "id": "e3d951bf-873f-49ac-a658-b2dcb91d3289",
                  "owner": "12345678",
                  "uid": "12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289",
                  "collection": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
                  "mockUrl": "https://e3d951bf-873f-49ac-a658-b2dcb91d3289.mock.pstmn.io",
                  "name": "Test Mock",
                  "config": {
                      "headers": [],
                      "matchBody": false,
                      "matchQueryParams": true,
                      "matchWildcards": true,
                      "delay": {
                          "type": "fixed",
                          "duration": 140000
                      },
                      "serverResponseId": "94d0f5d9-dbdf-4046-9a7d-a11f9b78ac65"
                  },
                  "createdAt": "2022-07-25T20:54:30.000Z",
                  "updatedAt": "2022-07-25T20:54:30.000Z",
                  "isPublic": false,
                  "deactivated": false,
                  "environment": "12345678-5daabc50-8451-43f6-922d-96b403b4f28e"
              }
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/mocks/:mockId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "forbiddenError",
                  "message": "You don't have access to this mock."
              }
          }
  - name: Not Found
    request:
      url: https://api.getpostman.com/mocks/:mockId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
    response:
      statusText: "404"
      body:
        type: text
        data: |-
          {
              "error": {
                  "name": "instanceNotFoundError",
                  "message": "The specified mock does not exist."
              }
          }
  - name: Rate Limit Exceeded
    request:
      url: https://api.getpostman.com/mocks/:mockId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
    response:
      statusText: "429"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
              "error": "rateLimited",
              "message": "Rate limit exceeded. Please retry after 1669048687"
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/mocks/:mockId
      method: GET
      params:
        - name: mockId
          value: 12345678-e3d951bf-873f-49ac-a658-b2dcb91d3289
          type: path
    response:
      statusText: "500"
      headers:
        - name: X-RateLimit-Limit
          value: "60"
        - name: X-RateLimit-Remaining
          value: "59"
        - name: X-RateLimit-Reset
          value: "1631439621"
        - name: X-RateLimit-RetryAfter
          value: "4"
        - name: RetryAfter
          value: "4"
      body:
        type: text
        data: |-
          {
            "error": {
              "type": "serverError",
              "message": "Something went wrong with the server"
            }
          }

docs: Gets information about a mock server.
