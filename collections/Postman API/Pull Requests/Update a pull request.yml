info:
  name: Update a pull request
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/pull-requests/:pullRequestId"
  params:
    - name: pullRequestId
      value: ""
      type: path
      description: The pull request's ID.
  body:
    type: json
    data: |-
      {
          "title": "{{pullRequestTitle}}",
          "description": "{{pullRequestDescription}}",
          "reviewers": [
              "{{userId}}"
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/pull-requests/:pullRequestId
      method: PUT
      params:
        - name: pullRequestId
          value: 4e1a6609-1a29-4037-a411-89ecc14c6cd8
          type: path
      body:
        type: json
        data: |-
          {
              "title": "Updated PR title",
              "description": "Updated description of the pull request.",
              "reviewers": [
                  "12345678",
                  "87654321"
              ]
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "id": "4e1a6609-1a29-4037-a411-89ecc14c6cd8",
              "createdAt": "2024-02-20T09:58:57.000Z",
              "updatedAt": "2024-02-20T09:58:57.000Z",
              "sourceId": "87654321-3b79068c-dbe5-41d5-a826-51be4bf646ef",
              "destinationId": "12345678-12ece9e1-2abf-4edc-8e34-de66e74114d2",
              "title": "Updated PR title",
              "description": "Updated description of the pull request.",
              "createdBy": "12345678",
              "status": "open",
              "forkType": "collection"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/pull-requests/:pullRequestId
      method: PUT
      params:
        - name: pullRequestId
          value: 4e1a6609-1a29-4037-a411-89ecc14c6cd8
          type: path
      body:
        type: json
        data: |-
          {
              "title": "Updated PR title",
              "description": "Updated description of the pull request.",
              "reviewers": [
                  "12345678",
                  "87654321"
              ]
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "You do not have enough permissions to perform this action.",
              "status": 403
          }
  - name: Conflict
    request:
      url: https://api.getpostman.com/pull-requests/:pullRequestId
      method: PUT
      params:
        - name: pullRequestId
          value: 4e1a6609-1a29-4037-a411-89ecc14c6cd8
          type: path
      body:
        type: json
        data: |-
          {
              "title": "Updated PR title",
              "description": "Updated description of the pull request.",
              "reviewers": [
                  "12345678",
                  "87654321"
              ]
          }
    response:
      statusText: "409"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/conflict",
              "title": "Conflict",
              "detail": "You cannot modify a pull request which is already merged or declined.",
              "status": 409
          }

docs: Updates an open pull request.
