info:
  name: Get secret types
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/secret-types"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "meta": {
                  "total": 4
              },
              "data": [
                  {
                      "name": "Postman Collection Key",
                      "id": "04084949-0dda-4735-ace5-f83038f7b200",
                      "type": "DEFAULT"
                  },
                  {
                      "name": "Planetscale API Token",
                      "id": "082351ca-810e-476b-8437-d098b20fba4b",
                      "type": "DEFAULT"
                  },
                  {
                      "name": "Open AI API Key",
                      "id": "0987c237-c1d0-4f07-a1af-a5772facf866",
                      "type": "DEFAULT"
                  },
                  {
                      "name": "Picatic API Key",
                      "id": "0eac968d-f65e-4f3d-9a34-c02138072835",
                      "type": "DEFAULT"
                  }
              ]
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 401,
              "title": "Unauthorized. Please try again with valid credentials.",
              "type": "UNAUTHORIZED"
          }
  - name: No Role Permissions
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 403,
              "title": "Only members with Superadmin, Admin, or Workspace Admin roles can view the detected secrets.",
              "type": "FORBIDDEN"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Missing Advanced Security Administration Add-On
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "FORBIDDEN",
              "title": "This feature is only available with \"Advanced Security Administration\" add-on. Contact your team admin to purchase this add-on.",
              "instance": "",
              "status": 403
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/secret-types
      method: GET
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/secret-types
      method: GET
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 500,
              "title": "An error occurred",
              "type": "SERVER_ERROR"
          }

docs: Gets the metadata of the secret types supported by Postman's [Secret Scanner](https://learning.postman.com/docs/administration/secret-scanner/). You can use a secret type's ID in the response to query data with the POST `/detected-secrets/{secretId}` endpoint.
