info:
  name: Update detected secret resolution status
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/detected-secrets/:secretId"
  params:
    - name: secretId
      value: ""
      type: path
      description: The secret's ID.
  body:
    type: json
    data: |-
      {
          "resolution": "{{secretResolutionStatus}}",
          "workspaceId": "{{workspaceId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "200"
      body:
        type: text
        data: |-
          {
              "secretHash": "50dbd2...",
              "workspaceId": "1f0df51a-8658-4ee8-a2a1-d2567dfa09a9",
              "resolution": "ACCEPTED_RISK",
              "history": [
                  {
                      "actor": 12345678,
                      "createdAt": "2024-09-18T18:46:26.000Z",
                      "resolution": "FALSE_POSITIVE"
                  },
                  {
                      "actor": 12345678,
                      "createdAt": "2024-09-18T18:43:11.000Z",
                      "resolution": "ACCEPTED_RISK"
                  }
              ]
          }
  - name: Unauthorized
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 401,
              "title": "Unauthorized. Please try again with valid credentials.",
              "type": "UNAUTHORIZED"
          }
  - name: No Role Permissions
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 403,
              "title": "Only members with Superadmin, Admin, or Workspace Admin roles can view the detected secrets.",
              "type": "FORBIDDEN"
          }
  - name: Forbidden
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "Forbidden",
              "status": 403
          }
  - name: Missing Advanced Security Administration Add-On
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "FORBIDDEN",
              "title": "This feature is only available with \"Advanced Security Administration\" add-on. Contact your team admin to purchase this add-on.",
              "instance": "",
              "status": 403
          }
  - name: Feature Unavailable
    request:
      url: https://api.eu.postman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "403"
      body:
        type: text
        data: |-
          {
              "type": "https://api.postman.com/problems/forbidden",
              "title": "Forbidden",
              "detail": "This feature isn't available in your region.",
              "status": 403
          }
  - name: Internal Server Error
    request:
      url: https://api.getpostman.com/detected-secrets/:secretId
      method: PUT
      params:
        - name: secretId
          value: MTc0ODA0Mw==
          type: path
      body:
        type: json
        data: |-
          {
              "resolution": "ACCEPTED_RISK",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "500"
      body:
        type: text
        data: |-
          {
              "instance": "",
              "status": 500,
              "title": "An error occurred",
              "type": "SERVER_ERROR"
          }

docs: Updates the resolution status of a secret detected in a workspace.
