          value: e361eeb4-00dd-4225-9774-6146a2555999
          type: query
        - name: limit
          value: "2"
          type: query
    response:
      statusText: "400"
      body:
        type: text
        data: |-
          {
              "instance": "aaa",
              "status": 400,
              "title": "limit specified is invalid",
              "type": "BAD_REQUEST"
          }
  - name: Invalid Resolution Type
    request:
      url: https://api.getpostman.com/detected-secrets/MTc0ODA0Mw==
      method: PUT
      body:
        type: json
        data: |-
          {
              "resolution": "TEST",
              "workspaceId": "e361eeb4-00dd-4225-9774-6146a2555999"
          }
    response:
      statusText: "401"
      body:
        type: text
        data: |-
          {
              "type": "BAD_REQUEST",
              "title": "`resolution` must be one of FALSE_POSITIVE, ACCEPTED_RISK, REVOKED, ACTIVE",
              "instance": "TEST",
              "status": 400
          }
